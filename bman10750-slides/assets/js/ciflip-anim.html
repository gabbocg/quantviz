<script>
/*
  Confidence-interval animation — slide #ciflip-intuition (Seminar 5).

  Teaching point: a confidence interval is not a new object that appears out
  of a formula. It is the SAMPLING DISTRIBUTION'S OWN BAND, measured from the
  other end. Advancing the fragments performs exactly that flip:
    0. the sampling distribution of xbar — where sample means land
    1. the central 95% band, mu +/- 1.96*SE — a fixed width around mu
    2. THE FLIP — one sample lands at xbar = 103.2, and the SAME band, the
       same number of pixels wide, slides across to sit around xbar instead.
       It still straddles mu, so this interval covers mu.
    3. the 5% — a sample at xbar = 107.5 fell outside the band in state 1, so
       the band centred on it cannot reach back to mu. That is the miss.

  Step 2 is the whole animation. The lane-B bracket is not drawn where it
  belongs and faded in: it is created on top of lane A and TRAVELS, so the
  audience sees one fixed-width object being relocated. "95% of sample means
  land within 5.88 of mu" and "mu is within 5.88 of 95% of sample means" are
  the same sentence, and the only honest way to show that is to move the
  same bracket.

  Every number is derived from (MU, SIGMA, N, Z): SE = sigma/sqrt(n) and
  HALF = z*SE drive the curve, the shading, all three brackets and every
  printed digit, and the covers/misses verdicts are COMPUTED by comparing
  |xbar - mu| against HALF rather than asserted in a string. The two sample
  means are the only hardcoded inputs, so the picture is identical in every
  rehearsal and in the room — no RNG.

  Built on StageKit (assets/js/stage-kit.html): palette, type roles and the
  Reveal fragment wiring live there. Canvas 1000x445, shown at scale(1.05).
*/
(function () {
  var K = window.StageKit;

  // --- the statistics ------------------------------------------------------
  var MU = 100, SIGMA = 15, N = 25, CONF = 0.95, Z = 1.959964;
  var SE = SIGMA / Math.sqrt(N);                 // 3
  var HALF = Z * SE;                             // 5.879892 -> "5.88"

  // The two samples. Chosen, not drawn: one inside the band and one outside,
  // so both sides of the 95/5 split are on screen at once.
  var XBAR_HIT = 103.2, XBAR_MISS = 107.5;

  // The verdicts are the point of the slide, so they are decided here by the
  // same comparison the students are being taught, not typed into a label.
  function covers(xbar) { return Math.abs(xbar - MU) <= HALF; }

  var PCT  = (CONF * 100).toFixed(0);            // "95"
  var TAIL = (100 - CONF * 100).toFixed(0);      // "5"

  // Trailing zeros are noise on a round number: SE prints as "3", not "3.00".
  function tidy(v) { return String(Math.round(v * 100) / 100); }

  // --- stage geometry — fixed 1000x445 space, scaled to the slide via CSS ---
  var W = 1000, H = 445;
  var X0 = 90, X1 = 910, VMIN = 88, VMAX = 112;
  var SCALE = (X1 - X0) / (VMAX - VMIN);         // 34.1667 px per unit
  var BASE = 234, PEAK_Y = 87;                   // baseline and apex of xbar
  var NPT = 200, NSHADE = 120;                   // curve / shading samples

  var INK = K.PAL.ink, SOFT = K.PAL.inkSoft, RULE = K.PAL.rule;
  var NAVY = K.PAL.navy, OLIVE = K.PAL.olive, BRICK = K.PAL.brick, GREY = K.PAL.dim;
  var MONO = K.FONT.mono, SANS = K.FONT.sans;

  // The three lanes below the axis. Each is a bracket plus a label under it;
  // the mu rule runs down through all of them so any lane can be read against
  // it by eye — "does this bracket contain the dashed line?" is the question
  // the whole slide is asking.
  var LANE_A = { br: 291, lab: 316 };            // the band around mu
  var LANE_B = { br: 352, lab: 376 };            // the interval around XBAR_HIT
  var LANE_C = { br: 396, lab: 421 };            // the interval around XBAR_MISS
  var TICK = 7;                                  // bracket end-tick length

  function px(v) { return X0 + (v - VMIN) * SCALE; }
  function py(d) { return BASE - d * PY; }

  // The density of xbar. One fixed pixels-per-density scale, derived so the
  // apex lands exactly on PEAK_Y — change SIGMA or N and the curve rescales
  // itself instead of overflowing the headroom.
  function dens(x) {
    var z = (x - MU) / SE;
    return Math.exp(-0.5 * z * z) / (SE * Math.sqrt(2 * Math.PI));
  }
  var PY = (BASE - PEAK_Y) / dens(MU);

  // Sampled across the whole ruler, which is mu +/- 4 SE, so the curve meets
  // the baseline at both ends and needs no clipping.
  function curvePath() {
    var d = '', i, x;
    for (i = 0; i <= NPT; i++) {
      x = VMIN + (VMAX - VMIN) * i / NPT;
      d += (i ? 'L' : 'M') + px(x).toFixed(2) + ' ' + py(dens(x)).toFixed(2);
    }
    return d;
  }

  // The central CONF of the curve as a closed region: along the curve from
  // mu-HALF to mu+HALF, down to the baseline, back along it.
  function bandPath() {
    var lo = MU - HALF, hi = MU + HALF, d = '', i, x;
    for (i = 0; i <= NSHADE; i++) {
      x = lo + (hi - lo) * i / NSHADE;
      d += (i ? 'L' : 'M') + px(x).toFixed(2) + ' ' + py(dens(x)).toFixed(2);
    }
    return d + 'L' + px(hi).toFixed(2) + ' ' + BASE +
               'L' + px(lo).toFixed(2) + ' ' + BASE + 'Z';
  }

  // A bracket in VALUE space: centre +/- HALF, with end ticks pointing down
  // at the label. Every lane is built by this one function, from the same
  // HALF, which is what makes "the same width" true in pixels and not just
  // in the caption.
  function bracket(centre, y) {
    var a = px(centre - HALF), b = px(centre + HALF);
    return 'M' + a.toFixed(2) + ' ' + y + 'V' + (y + TICK) +
           'H' + b.toFixed(2) + 'V' + y;
  }
  function mid(centre) { return (px(centre - HALF) + px(centre + HALF)) / 2; }

  // The flip itself, in pixels: lane B is lane A shifted right by the distance
  // from mu to xbar, and down one lane. u = 0 puts lane B exactly on top of
  // lane A; u = 1 is its resting place.
  var SHIFT_X = px(XBAR_HIT) - px(MU);
  var SHIFT_Y = LANE_B.br - LANE_A.br;

  // Keep these SHORT. The caption is left-anchored at x=40, y=28; at 24px
  // Roboto (~12px per character) anything much past ~40 characters runs
  // under the right-hand furniture.
  var CAPTIONS = {
    0: 'where sample means land',
    1: PCT + '% of them land in this band',
    2: 'the same distance, from x̄ instead',
    3: 'the ' + TAIL + '% is exactly this case'
  };

  // JetBrains Mono does not compose U+0304, so a typed "x̄" renders as an "x"
  // with a stray macron beside it. Emit a bare "x" and draw the bar instead —
  // the mono grid (0.6 em advance) makes the overline's span exact.
  function meanLabel(parent, cx, y, value, colour) {
    // The overline sits above the glyph in proportion to the label role's
    // size, same 0.767 ratio the 15px original used, scaled up to 20px.
    var ADV = K.TYPE.label * 0.6, OVER = K.TYPE.label * 0.767;
    var str = 'x = ' + value.toFixed(1);
    var x0 = cx - str.length * ADV / 2;
    parent.appendChild(K.txt(x0, y, str, { size: 'label', face: 'mono', fill: colour }));
    parent.appendChild(K.el('line', {
      x1: x0 + ADV * 0.12, y1: y - OVER, x2: x0 + ADV * 0.88, y2: y - OVER,
      stroke: colour, 'stroke-width': 1.6, 'stroke-linecap': 'round'
    }));
  }

  function build(stage) {
    var svg = K.canvas(stage, W, H);

    var cap = svg.appendChild(K.txt(40, 28, CAPTIONS[0],
      { size: 'caption', cls: 'ciflip-caption' }));

    // --- the shaded band, under the stroke so the outline stays crisp ---
    var band = svg.appendChild(K.el('path', {
      d: bandPath(), fill: NAVY, 'fill-opacity': 0.16, stroke: 'none',
      opacity: 0, class: 'ciflip-band'
    }));

    // --- the sampling distribution of xbar ---
    svg.appendChild(K.el('path', {
      d: curvePath(), fill: 'none', stroke: NAVY, 'stroke-width': 2.5,
      'stroke-linejoin': 'round', class: 'ciflip-curve'
    }));

    // --- the ruler ---
    svg.appendChild(K.el('line', {
      x1: X0, y1: BASE, x2: X1, y2: BASE, stroke: RULE, 'stroke-width': 1
    }));
    [90, 95, 100, 105, 110].forEach(function (v) {
      svg.appendChild(K.el('line', {
        x1: px(v), y1: BASE, x2: px(v), y2: BASE + 6,
        stroke: GREY, 'stroke-width': 1
      }));
    });

    // --- mu: one dashed rule the whole picture is read against ---
    // Drawn before the tick labels and the lane labels so that where it
    // crosses type, the type wins.
    svg.appendChild(K.el('line', {
      x1: px(MU), y1: PEAK_Y, x2: px(MU), y2: 423,
      stroke: NAVY, 'stroke-width': 1.5, 'stroke-dasharray': '5 5',
      opacity: 0.75
    }));

    [90, 95, 100, 105, 110].forEach(function (v) {
      svg.appendChild(K.txt(px(v), 258, String(v),
        { size: 'tick', face: 'mono', anchor: 'middle' }));
    });

    svg.appendChild(K.txt(px(MU) + 12, 78, 'μ = ' + MU,
      { size: 'label', face: 'mono', fill: NAVY }));

    // The one number the students have to carry into every other slide, put
    // where the right shoulder leaves room for it.
    svg.appendChild(K.txt(720, 167, 'SE = σ/√n = ' + tidy(SE),
      { size: 'label', face: 'mono', fill: SOFT }));

    // --- lane A: the band around mu ---
    var gA = svg.appendChild(K.el('g', { opacity: 0, class: 'ciflip-lane-a' }));
    gA.appendChild(K.el('path', {
      d: bracket(MU, LANE_A.br), fill: 'none', stroke: NAVY, 'stroke-width': 2
    }));
    gA.appendChild(K.txt(mid(MU), LANE_A.lab,
      PCT + '% of x̄ land within ' + HALF.toFixed(2) + ' of μ',
      { size: 'label', anchor: 'middle', fill: NAVY }));

    // --- lane C: the interval that misses (drawn under the dots) ---
    var gC = svg.appendChild(K.el('g', { opacity: 0, class: 'ciflip-lane-c' }));
    gC.appendChild(K.el('path', {
      d: bracket(XBAR_MISS, LANE_C.br), fill: 'none', stroke: BRICK,
      'stroke-width': 2
    }));
    gC.appendChild(K.txt(mid(XBAR_MISS), LANE_C.lab,
      'x̄ fell ' + (covers(XBAR_MISS) ? 'inside' : 'outside') +
      ' the band — μ is ' + (covers(XBAR_MISS) ? 'in it' : 'not in it'),
      { size: 'label', anchor: 'middle', fill: BRICK }));

    // --- lane B: the flip. The bracket lives in its own group so it can be
    // translated as a rigid body; its label is a separate node that stays put
    // and fades in on arrival, because a label riding along would land on top
    // of lane A's label for the first half of the journey. ---
    var gB = svg.appendChild(K.el('g', { opacity: 0, class: 'ciflip-lane-b' }));
    var brB = gB.appendChild(K.el('path', {
      d: bracket(XBAR_HIT, LANE_B.br), fill: 'none', stroke: OLIVE,
      'stroke-width': 2
    }));
    var labB = svg.appendChild(K.txt(mid(XBAR_HIT), LANE_B.lab,
      'same width, now centred on x̄ — μ is ' +
      (covers(XBAR_HIT) ? 'inside' : 'outside'),
      { size: 'label', anchor: 'middle', fill: OLIVE }));
    labB.setAttribute('opacity', 0);

    // --- the two samples, on top of everything ---
    var gHit = svg.appendChild(K.el('g', { opacity: 0, class: 'ciflip-hit' }));
    gHit.appendChild(K.el('circle', {
      cx: px(XBAR_HIT), cy: BASE, r: 6, fill: NAVY
    }));
    meanLabel(gHit, px(XBAR_HIT), 216, XBAR_HIT, INK);

    var gMiss = svg.appendChild(K.el('g', { opacity: 0, class: 'ciflip-miss' }));
    gMiss.appendChild(K.el('circle', {
      cx: px(XBAR_MISS), cy: BASE, r: 6, fill: BRICK
    }));
    meanLabel(gMiss, px(XBAR_MISS), 216, XBAR_MISS, BRICK);

    return {
      state: 0, cap: cap, band: band, gA: gA, gB: gB, brB: brB, labB: labB,
      gC: gC, gHit: gHit, gMiss: gMiss
    };
  }

  // Where lane B's bracket sits: u = 0 is exactly on lane A, u = 1 is home.
  function placeB(s, u) {
    var dx = (u - 1) * SHIFT_X, dy = (u - 1) * SHIFT_Y;
    s.gB.setAttribute('transform',
      'translate(' + dx.toFixed(2) + ' ' + dy.toFixed(2) + ')');
  }

  // Target opacity of every gated element for a given state.
  function opacities(st) {
    return {
      band: st >= 1 ? 1 : 0,
      gA:   st >= 1 ? 1 : 0,
      gB:   st >= 2 ? 1 : 0,
      labB: st >= 2 ? 1 : 0,
      gHit: st >= 2 ? 1 : 0,
      gC:   st >= 3 ? 1 : 0,
      gMiss:st >= 3 ? 1 : 0
    };
  }

  function render(s, st, instant) {
    var prev = s.state;
    s.state = st;
    s.cap.textContent = CAPTIONS[st];
    var O = opacities(st);

    // Cancel whatever is still in flight before starting the next beat. The
    // flip drives lane B's transform and stroke colour, so a tween left
    // running from the previous state keeps writing its own end values over
    // a freshly rendered one — visible as a bracket sliding back into a state
    // that no longer has it if a presenter arrows back and forth quickly.
    if (s.anim && s.anim.pause) s.anim.pause();
    if (s.animOpa && s.animOpa.pause) s.animOpa.pause();
    if (s.animB && s.animB.pause) s.animB.pause();
    if (s.animLab && s.animLab.pause) s.animLab.pause();
    if (s.animStroke && s.animStroke.pause) s.animStroke.pause();

    if (instant || K.REDUCE || !K.animeReady()) {
      s.band.setAttribute('opacity', O.band);
      s.gA.setAttribute('opacity', O.gA);
      s.gB.setAttribute('opacity', O.gB);
      s.labB.setAttribute('opacity', O.labB);
      s.gHit.setAttribute('opacity', O.gHit);
      s.gC.setAttribute('opacity', O.gC);
      s.gMiss.setAttribute('opacity', O.gMiss);
      s.brB.setAttribute('stroke', OLIVE);
      placeB(s, 1);
      return;
    }

    var A = window.anime;
    var flipIn  = (st === 2 && prev === 1);
    var flipOut = (st === 1 && prev === 2);

    // Everything that is only ever a fade. Lane B is handled apart from this
    // list whenever it is flipping, so its timing is not tied to the others'.
    var fades = [
      { n: s.band,  o: O.band },
      { n: s.gA,    o: O.gA },
      { n: s.gHit,  o: O.gHit },
      { n: s.gC,    o: O.gC },
      { n: s.gMiss, o: O.gMiss }
    ];
    if (!flipIn && !flipOut) {
      fades.push({ n: s.gB, o: O.gB });
      fades.push({ n: s.labB, o: O.labB });
      s.brB.setAttribute('stroke', OLIVE);
      placeB(s, 1);
    }
    s.animOpa = A.animate(fades.map(function (f) { return f.n; }), {
      opacity: function (n, i) { return fades[i].o; },
      duration: 380,
      ease: 'outCubic'
    });

    if (flipIn) {
      // THE FLIP. The bracket is created on lane A, in lane A's navy, and is
      // then carried to lane B; only on arrival does it turn olive and pick
      // up its label. Nothing about it is redrawn, which is the claim.
      placeB(s, 0);
      s.brB.setAttribute('stroke', NAVY);
      s.labB.setAttribute('opacity', 0);
      s.gB.setAttribute('opacity', 0);

      s.animB = A.animate(s.gB, {
        opacity: 1, duration: 200, delay: 180, ease: 'outCubic'
      });

      var p = { u: 0 };
      s.anim = A.animate(p, {
        u: 1, duration: 800, delay: 300, ease: 'outCubic',
        onUpdate: function () { placeB(s, p.u); }
      });

      s.animStroke = A.animate(s.brB, {
        stroke: OLIVE, duration: 420, delay: 620, ease: 'outCubic'
      });
      s.animLab = A.animate(s.labB, {
        opacity: 1, duration: 320, delay: 940, ease: 'outCubic'
      });

    } else if (flipOut) {
      // Stepping back must undo the flip rather than blink it away, or the
      // second viewing of the slide tells a different story from the first.
      s.brB.setAttribute('stroke', NAVY);
      s.animLab = A.animate(s.labB, {
        opacity: 0, duration: 160, ease: 'outCubic'
      });
      var q = { u: 1 };
      s.anim = A.animate(q, {
        u: 0, duration: 500, delay: 120, ease: 'outCubic',
        onUpdate: function () { placeB(s, q.u); }
      });
      s.animB = A.animate(s.gB, {
        opacity: 0, duration: 200, delay: 440, ease: 'outCubic'
      });
    }
  }

  K.register({
    stage: 'ciflip-stage',
    frags: ['ciflip-frag-1', 'ciflip-frag-2', 'ciflip-frag-3'],
    build: build,
    place: render
  });
})();
</script>
