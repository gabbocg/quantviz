<script>
/*
  Central limit theorem animation — slide #clt-intuition.

  Teaching point: the CLT says nothing whatever about the DATA. The left panel
  is the population — a hard right-skewed lump on the integers 0..9 — and it is
  drawn once and never touched again, because averaging does not launder it.
  What becomes normal is the SAMPLE MEAN, and the right panel shows it: 400
  simulated means, each the average of n draws from the left panel, as the
  presenter advances fragments:
    0. n = 1    the mean IS one observation, so the right panel IS the left one
    1. n = 2    already visibly less skewed
    2. n = 5    nearly symmetric
    3. n = 30   a bell, and much narrower

  The second thing students are never shown is that the spread shrinks at a
  KNOWN rate, sigma/sqrt(n). So the right panel keeps a FIXED x-axis (0 to 5)
  across every state — rescale it per n and the narrowing vanishes into the
  axis — and the mono line underneath prints the observed SD of the 400 means
  next to the predicted sigma/sqrt(n). They agree to two decimals in all four
  states, which is the whole claim, made arithmetically rather than asserted.

  The brick curve is Normal(population mean, sigma/sqrt(n)). Nothing about it
  is fitted to the histogram: both are in count units under the same scale, so
  when it lands on the bars at n = 30 that is a result, not a construction. At
  n = 1 it is a low wide arc nowhere near the spikes, which is correct — the
  population is not normal and the curve is not pretending otherwise.

  Built on StageKit (assets/js/stage-kit.html): palette, type roles and the
  Reveal fragment wiring live there. Canvas 1000x445, shown at scale(1.05).
*/
(function () {
  var K = window.StageKit;

  // Stage geometry — 1000x445 canvas, shown at scale(1.05).
  var W = 1000, H = 445;
  var LX0 = 70, LX1 = 420;                        // left panel: the population
  var RX0 = 560, RX1 = 950;                       // right panel: the sample mean
  var BASE = 356, HMAX = 211, AXIS_Y = 384, FOOT_Y = 416;

  // --- the population: relative frequency exp(-RATE * v) on v = 0 .. VMAX ---
  var RATE = 0.55, VMAX = 9, NV = VMAX + 1;

  // --- the simulation: 400 sample means per state, fixed axis 0 .. 5 ---
  var NSAMP = 400, SEED = 3363;
  // The right axis must span the SAME range as the population (0..9), not a
  // convenient 0..5. Two reasons: at n = 1 the sample mean IS one observation,
  // so the two panels have to be visibly identical for that claim to land; and
  // a narrower right axis silently drops the means in the population's tail
  // (48 bins of 0.2 reach 9.5, so nothing is discarded at any n).
  var NBIN = 48, BINW = 0.2, XLO = -0.1;          // bin b is [XLO+b*BINW, +BINW)
  var SPAN = NBIN * BINW;                         // 9.6, the same for every n
  var NCURVE = 160;                               // segments in the normal overlay

  var STAGES = [
    // Captions stay under ~46 characters at 24px Roboto from x = 40, so they
    // land well clear of the panel divide at x = 490; the orange n = ...
    // readout has moved to the right edge (x = 950, right-aligned) so it no
    // longer competes with the caption band.
    { n: 1,  cap: 'n = 1 — the mean IS one observation' },
    { n: 2,  cap: 'n = 2 — already less skewed' },
    { n: 5,  cap: 'n = 5 — nearly symmetric' },
    { n: 30, cap: 'n = 30 — normal, and much narrower' }
  ];

  // --- population weights, and the two numbers that drive everything else ---
  var P = [], tot = 0, v;
  for (v = 0; v < NV; v++) { P.push(Math.exp(-RATE * v)); tot += P[v]; }
  for (v = 0; v < NV; v++) P[v] /= tot;

  var CUM = [], run = 0;
  for (v = 0; v < NV; v++) { run += P[v]; CUM.push(run); }

  var mu = 0, m2 = 0;
  for (v = 0; v < NV; v++) { mu += v * P[v]; m2 += v * v * P[v]; }
  var POP_MEAN = mu, POP_SD = Math.sqrt(m2 - mu * mu);   // 1.3228, 1.6768

  // Seeded 32-bit LCG with the output run through a hash. The bare LCG is fine
  // one draw at a time but its consecutive pairs sit on a coarse lattice, and
  // the n = 2 panel averages exactly those pairs — it came out 12% too narrow
  // before the mixing step went in. No Math.random anywhere: the lecture
  // picture has to be the same on every machine, every year.
  function lcg(seed) {
    var s = seed >>> 0;
    return function () {
      s = (Math.imul(1664525, s) + 1013904223) >>> 0;
      var t = s ^ (s >>> 15);
      t = Math.imul(t, 2246822507); t ^= t >>> 13;
      t = Math.imul(t, 3266489909); t ^= t >>> 16;
      return (t >>> 0) / 4294967296;
    };
  }

  // Inverse CDF on the cumulative weights — the only sampler in play, so the
  // right panel is drawing from precisely the distribution the left panel draws.
  function drawFrom(u) {
    for (var k = 0; k < NV; k++) if (u < CUM[k]) return k;
    return VMAX;
  }

  // The 400 sample means for one n. Every state restarts the same stream, so
  // the states are common-random-number versions of one another: what changes
  // between panels is the size of the group being averaged, nothing else.
  function sampleMeans(n) {
    var rnd = lcg(SEED), out = [], i, j, s;
    for (i = 0; i < NSAMP; i++) {
      s = 0;
      for (j = 0; j < n; j++) s += drawFrom(rnd());
      out.push(s / n);
    }
    return out;
  }

  function normPdf(x, m, s) {
    var z = (x - m) / s;
    return Math.exp(-0.5 * z * z) / (s * Math.sqrt(2 * Math.PI));
  }

  // Everything about one state, worked out once at build time.
  function makeState(n) {
    var xs = sampleMeans(n), i, b;

    // Observed SD over ALL 400 means — not over the histogram. A handful of
    // the n = 1 means fall past 4.9 and off the fixed axis; they still count.
    var mean = 0;
    for (i = 0; i < NSAMP; i++) mean += xs[i];
    mean /= NSAMP;
    var ss = 0;
    for (i = 0; i < NSAMP; i++) ss += (xs[i] - mean) * (xs[i] - mean);
    var obsSD = Math.sqrt(ss / (NSAMP - 1));

    var counts = [];
    for (b = 0; b < NBIN; b++) counts.push(0);
    for (i = 0; i < NSAMP; i++) {
      b = Math.floor((xs[i] - XLO) / BINW);
      if (b >= 0 && b < NBIN) counts[b]++;
    }

    // Bars and curve share one count-to-pixel scale, so the overlay is a
    // genuine comparison. The scale is per state — each histogram fills the
    // panel — because the point being made here is the WIDTH, and the fixed
    // axis already carries it. Taking the max over both keeps the curve inside
    // the panel at n = 30, where it out-peaks the noisier bars.
    var sig = POP_SD / Math.sqrt(n);
    var peak = NSAMP * BINW * normPdf(POP_MEAN, POP_MEAN, sig);
    var top = Math.max.apply(null, counts.concat([peak]));
    var scale = HMAX / top;

    var hs = counts.map(function (c) { return c * scale; });
    var cy = [];
    for (i = 0; i <= NCURVE; i++) {
      var x = XLO + SPAN * i / NCURVE;
      cy.push(BASE - NSAMP * BINW * normPdf(x, POP_MEAN, sig) * scale);
    }

    return {
      n: n, hs: hs, cy: cy,
      foot: 'SD ' + obsSD.toFixed(2) + '   sigma/sqrt(n) ' + sig.toFixed(2)
    };
  }

  var ST = STAGES.map(function (s) { return makeState(s.n); });

  function lbx(k) { return LX0 + k * (LX1 - LX0) / NV; }          // left bar edge
  function rbx(b) { return RX0 + b * (RX1 - RX0) / NBIN; }        // right bin edge
  function rvx(x) { return RX0 + (x - XLO) / SPAN * (RX1 - RX0); } // value -> px
  function ncx(i) { return RX0 + i * (RX1 - RX0) / NCURVE; }
  function poly(ys) {
    return ys.map(function (y, i) { return ncx(i) + ',' + y; }).join(' ');
  }

  var LSLOT = (LX1 - LX0) / NV, LBW = LSLOT - 11;   // 35 per value, 24 of it inked
  var RSLOT = (RX1 - RX0) / NBIN, RBW = RSLOT - 2;  // 15.6 per bin, 13.6 inked

  function build(stage) {
    var svg = K.canvas(stage, W, H);
    var i;

    // --- the divider, so the two panels read as two claims, not one chart ---
    svg.appendChild(K.el('line', {
      x1: 490, y1: 67, x2: 490, y2: 389, stroke: K.PAL.rule, 'stroke-width': 1
    }));

    // --- LEFT: the population. Built once, animated never. ---
    for (i = 0; i < NV; i++) {
      var h = P[i] / P[0] * HMAX;                  // P(0) is the mode, so it fills
      svg.appendChild(K.el('rect', {
        x: lbx(i) + (LSLOT - LBW) / 2, y: BASE - h, width: LBW, height: h,
        fill: K.PAL.navy, opacity: 0.55, class: 'clt-pop'
      }));
    }
    svg.appendChild(K.el('line', {
      x1: LX0, y1: BASE, x2: LX1, y2: BASE, stroke: K.PAL.rule, 'stroke-width': 1
    }));
    for (i = 0; i < NV; i++) {
      svg.appendChild(K.txt(lbx(i) + LSLOT / 2, AXIS_Y, i,
        { size: 'tick', face: 'mono', anchor: 'middle' }));
    }

    // --- RIGHT: the sample mean. Bars first, overlay on top of them. ---
    var bars = ST[0].hs.map(function (h, b) {
      return svg.appendChild(K.el('rect', {
        x: rbx(b) + 1, y: BASE - h, width: RBW, height: h,
        fill: K.PAL.olive, opacity: 0.6, class: 'clt-bar'
      }));
    });
    var curve = svg.appendChild(K.el('polyline', {
      points: poly(ST[0].cy), fill: 'none',
      stroke: K.PAL.brick, 'stroke-width': 2, 'stroke-linejoin': 'round',
      opacity: 0.8, class: 'clt-normal'
    }));
    svg.appendChild(K.el('line', {
      x1: RX0, y1: BASE, x2: RX1, y2: BASE, stroke: K.PAL.rule, 'stroke-width': 1
    }));
    // 0..9, matching the population panel's labels exactly.
    for (i = 0; i <= 9; i++) {
      svg.appendChild(K.txt(rvx(i), AXIS_Y, i,
        { size: 'tick', face: 'mono', anchor: 'middle' }));
    }

    // --- the population mean, marked in both panels: the centre never moves,
    //     only the spread does, and side by side that is hard to miss ---
    [rvx(POP_MEAN), LX0 + (POP_MEAN + 0.5) * LSLOT].forEach(function (x) {
      svg.appendChild(K.el('line', {
        x1: x, y1: 149, x2: x, y2: BASE, stroke: K.PAL.dim,
        'stroke-width': 1, 'stroke-dasharray': '3 5', opacity: 0.8
      }));
    });

    // --- caption: which n we are looking at, in words ---
    var cap = K.txt(40, 28, STAGES[0].cap, { size: 'caption', cls: 'clt-caption' });
    svg.appendChild(cap);

    // --- and the same n as a number, at the right edge of the panel it
    //     governs — the right edge because a 24px caption at x = 40 now
    //     runs long enough to pass underneath x = 560 ---
    var read = K.txt(950, 87, 'n = ' + STAGES[0].n,
      { size: 'readout', face: 'mono', fill: 'orange', weight: 700,
        anchor: 'end', cls: 'clt-n' });
    svg.appendChild(read);

    // --- panel titles ---
    var ltitle = K.txt(LX0, 116, 'the population — never changes',
      { size: 'label', fill: 'inkSoft' });
    svg.appendChild(ltitle);

    var rtitle = K.txt(RX0, 116, 'the mean of n draws',
      { size: 'label', fill: 'inkSoft' });
    svg.appendChild(rtitle);

    // --- the population's own two numbers, stated once and left alone ---
    var lfoot = K.txt(LX0, FOOT_Y,
      'mean ' + POP_MEAN.toFixed(2) + '   SD ' + POP_SD.toFixed(2),
      { size: 'label', face: 'mono', fill: 'ink' });
    svg.appendChild(lfoot);

    // --- the payoff line: what we measured, next to what theory predicted ---
    var rfoot = K.txt(RX0, FOOT_Y, ST[0].foot,
      { size: 'label', face: 'mono', fill: 'inkSoft', cls: 'clt-sd' });
    svg.appendChild(rfoot);

    return { cap: cap, read: read, foot: rfoot, bars: bars, curve: curve,
             cy: ST[0].cy };
  }

  function place(s, i, instant) {
    var st = ST[i], from = s.cy;

    s.cap.textContent = STAGES[i].cap;
    s.read.textContent = 'n = ' + st.n;
    s.foot.textContent = st.foot;

    if (instant || K.REDUCE || !K.animeReady()) {
      s.bars.forEach(function (r, b) {
        r.setAttribute('y', BASE - st.hs[b]);
        r.setAttribute('height', st.hs[b]);
      });
      s.curve.setAttribute('points', poly(st.cy));
      s.cy = st.cy;
      return;
    }

    var A = window.anime;

    // Rects grow downward from y, so y and height have to move together or the
    // bars would slide off the baseline mid-flight.
    A.animate(s.bars, {
      y: function (el, b) { return BASE - st.hs[b]; },
      height: function (el, b) { return st.hs[b]; },
      duration: 650,
      delay: A.stagger(12),              // sweeps left to right
      ease: 'outCubic'
    });

    // The polyline has no tweenable attribute, so drive a scalar and rebuild
    // the points string from it — same easing, same clock as the bars, so the
    // curve tightens onto the histogram rather than arriving after it.
    var p = { t: 0 };
    A.animate(p, {
      t: 1,
      duration: 650,
      ease: 'outCubic',
      onUpdate: function () {
        s.curve.setAttribute('points', poly(st.cy.map(function (y, j) {
          return from[j] + (y - from[j]) * p.t;
        })));
      }
    });

    s.cy = st.cy;
  }

  K.register({
    stage: 'clt-stage',
    frags: ['clt-frag-1', 'clt-frag-2', 'clt-frag-3'],
    build: build,
    place: place
  });
})();
</script>
