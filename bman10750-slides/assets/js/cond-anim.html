<script>
/*
  Conditioning animation — slide #cond-intuition (Seminar 3).

  Teaching point: conditioning is not a new formula, it is a change of
  DENOMINATOR. The unit square is 100% of office managers. Advancing the
  fragments walks the natural-frequency story:
    0. split by whether they would buy          (80 / 20)
    1. split each column by upgrade             (32 / 48 / 2 / 18)
    2. we learn "would upgrade" — 66% is gone
    3. the two survivors regrow to fill the square: 32/34 = 94%

  Step 3 is the whole animation. Keeping the WIDTHS fixed while the two
  orange regions stretch to full height is what makes "same evidence, new
  denominator" visible rather than asserted.

  Fragment gating follows the deck convention: invisible .fi-frag spans on
  the slide, listened to via Reveal's fragmentshown/fragmenthidden.
*/
(function () {
  var REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Stage geometry — fixed 1000x400 space, scaled to the slide via CSS.
  var W = 1000, H = 400;
  var SQ_X = 250, SQ_Y = 70, SQ_W = 500, SQ_H = 270;

  // Column split: P(buy) = 0.8 of the WIDTH.
  var BUY_W = SQ_W * 0.80;              // 400
  var NB_W  = SQ_W - BUY_W;             // 100
  var NB_X  = SQ_X + BUY_W;             // 650

  // Row split inside each column: P(upgrade | column) of that column's HEIGHT.
  var BUY_UP_H = SQ_H * 0.40;           // 108  -> 32% of the square
  var NB_UP_H  = SQ_H * 0.10;           //  27  ->  2% of the square

  var INK = '#3E3F3A', SOFT = '#6E7681', RULE = '#E5E7EB';
  var NAVY = '#325D88', ORANGE = '#F47C3C', GREY = '#B0B7C0';
  var MONO = 'JetBrains Mono, monospace', SANS = 'Roboto, sans-serif';
  var NS = 'http://www.w3.org/2000/svg';

  function el(name, attrs) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function txt(attrs, s) { var t = el('text', attrs); t.textContent = s; return t; }
  function merge(a, b) {
    var o = {}, k;
    for (k in a) o[k] = a[k];
    for (k in b) o[k] = b[k];
    return o;
  }
  function setAttrs(n, p) { for (var k in p) n.setAttribute(k, p[k]); }

  // Keep these SHORT. The caption is left-anchored at x=40, y=34; once the
  // columns subdivide the "Buy"/"No buy" headers rise to y=46 centred on
  // x=450 and x=700. A caption much past ~44 characters runs straight under
  // the Buy header at 17px Roboto (~8.4px per character).
  var CAPTIONS = {
    0: '100% of managers, split by buying',
    1: 'each column splits by upgrading',
    2: 'we observed “would upgrade”',
    3: 're-normalise to the new denominator'
  };

  function build(stage) {
    stage.innerHTML = '';
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H });

    var cap = txt({
      x: 40, y: 34, fill: SOFT, 'font-size': 17, 'font-family': SANS,
      class: 'cond-caption'
    }, CAPTIONS[0]);
    svg.appendChild(cap);

    // --- fill layer -------------------------------------------------------
    // Regions carry fill only; the column outlines below own the strokes, so
    // the square looks like two clean columns until the dividers draw in.
    //
    // Each upgrade region is TWO stacked rects: a pale one matching its column
    // and an orange one on top. State 1 cross-fades between them, which avoids
    // tweening navy -> orange through a muddy midpoint.
    function region(x, y, w, h, fill, op) {
      return svg.appendChild(el('rect', {
        x: x, y: y, width: w, height: h, fill: fill, 'fill-opacity': op
      }));
    }

    // No-upgrade regions first: in state 3 the growing orange rects must
    // paint OVER them, so they have to sit lower in the document order.
    var buyNo = region(SQ_X, SQ_Y + BUY_UP_H, BUY_W, SQ_H - BUY_UP_H, NAVY, 0.18);
    var nbNo  = region(NB_X, SQ_Y + NB_UP_H,  NB_W,  SQ_H - NB_UP_H,  GREY, 0.18);

    var buyUpPale = region(SQ_X, SQ_Y, BUY_W, BUY_UP_H, NAVY, 0.18);
    var nbUpPale  = region(NB_X, SQ_Y, NB_W,  NB_UP_H,  GREY, 0.18);

    function orange(x, w, h) {
      return svg.appendChild(el('rect', {
        x: x, y: SQ_Y, width: w, height: h,
        fill: ORANGE, 'fill-opacity': 0,
        stroke: ORANGE, 'stroke-width': 1.5, 'stroke-opacity': 0
      }));
    }
    var buyUpOr = orange(SQ_X, BUY_W, BUY_UP_H);
    var nbUpOr  = orange(NB_X,  NB_W,  NB_UP_H);

    // --- column outlines --------------------------------------------------
    svg.appendChild(el('rect', {
      x: SQ_X, y: SQ_Y, width: BUY_W, height: SQ_H,
      fill: 'none', stroke: NAVY, 'stroke-width': 1.5
    }));
    svg.appendChild(el('rect', {
      x: NB_X, y: SQ_Y, width: NB_W, height: SQ_H,
      fill: 'none', stroke: GREY, 'stroke-width': 1.5
    }));

    // --- horizontal dividers, drawn in by dashoffset ----------------------
    function divider(x, y, len, colour) {
      return svg.appendChild(el('line', {
        x1: x, y1: y, x2: x + len, y2: y,
        stroke: colour, 'stroke-width': 1.5,
        'stroke-dasharray': len, 'stroke-dashoffset': len, opacity: 1
      }));
    }
    var divBuy = divider(SQ_X, SQ_Y + BUY_UP_H, BUY_W, NAVY);
    var divNb  = divider(NB_X, SQ_Y + NB_UP_H,  NB_W,  GREY);

    // --- column labels ----------------------------------------------------
    // They start centred inside their column and rise to become headers once
    // the columns are subdivided, otherwise they collide with the row labels.
    function colLab(x, title, pct, colour) {
      return {
        t: svg.appendChild(txt({
          x: x, y: 198, 'text-anchor': 'middle', fill: colour,
          'font-size': 20, 'font-family': SANS
        }, title)),
        p: svg.appendChild(txt({
          x: x, y: 224, 'text-anchor': 'middle', fill: colour,
          'font-size': 17, 'font-family': MONO
        }, pct))
      };
    }
    var buyLab = colLab(SQ_X + BUY_W / 2, 'Buy', '80%', NAVY);
    var nbLab  = colLab(NB_X + NB_W / 2, 'No buy', '20%', SOFT);

    // --- region labels ----------------------------------------------------
    function pctLab(x, y, s, colour, weight) {
      return svg.appendChild(txt({
        x: x, y: y, 'text-anchor': 'middle', fill: colour,
        'font-size': 15, 'font-weight': weight, 'font-family': MONO, opacity: 0
      }, s));
    }
    var lBuyUp = pctLab(SQ_X + BUY_W / 2, 129, '32%', INK, 700);
    var lBuyNo = pctLab(SQ_X + BUY_W / 2, 264, '48%', SOFT, 400);
    var lNbNo  = pctLab(NB_X + NB_W / 2, 223, '18%', SOFT, 400);
    // The NoBuy&Upgrade sliver is only 27px tall, so its label lives outside
    // on a leader until state 3 grows the region enough to hold it.
    var lNbUp  = pctLab(788, 88, '2%', INK, 700);
    var leader = svg.appendChild(el('line', {
      x1: NB_X + NB_W + 4, y1: SQ_Y + NB_UP_H / 2,
      x2: 770, y2: SQ_Y + NB_UP_H / 2,
      stroke: GREY, 'stroke-width': 1, opacity: 0
    }));

    // --- result -----------------------------------------------------------
    svg.appendChild(el('line', {
      x1: SQ_X, y1: 356, x2: SQ_X + SQ_W, y2: 356,
      stroke: RULE, 'stroke-width': 1
    }));
    var result = svg.appendChild(txt({
      x: SQ_X + SQ_W / 2, y: 383, 'text-anchor': 'middle', fill: NAVY,
      'font-size': 20, 'font-weight': 700, 'font-family': MONO, opacity: 0
    }, 'P(buy | upgrade) = 32 / 34 = 0.94'));

    stage.appendChild(svg);

    return {
      state: 0, cap: cap,
      buyNo: buyNo, nbNo: nbNo,
      buyUpPale: buyUpPale, nbUpPale: nbUpPale,
      buyUpOr: buyUpOr, nbUpOr: nbUpOr,
      divBuy: divBuy, divNb: divNb,
      buyLab: buyLab, nbLab: nbLab,
      lBuyUp: lBuyUp, lBuyNo: lBuyNo, lNbNo: lNbNo, lNbUp: lNbUp,
      leader: leader, result: result,
      // Scalars for the counting labels (see render).
      cBuy: { v: 32 }, cNb: { v: 2 }
    };
  }

  // Every animated value for a given state, as {nodes, props} groups.
  function plan(s, st) {
    var grown = st >= 3;
    var geoBuy = { y: SQ_Y, height: grown ? SQ_H : BUY_UP_H };
    var geoNb  = { y: SQ_Y, height: grown ? SQ_H : NB_UP_H };
    var split  = st >= 1 ? 1 : 0;          // dividers drawn?
    var rowOp  = st >= 1 ? 1 : 0;          // row labels visible?
    var dimmed = st >= 2 ? 0.06 : 0.18;    // the discarded 66%
    var headY  = st >= 1;

    return [
      // Discarded regions dim together, one beat apart.
      { n: [s.buyNo, s.nbNo], p: { 'fill-opacity': dimmed }, stagger: 70 },

      // Pale under-layer fades out exactly as the orange comes up.
      { n: [s.buyUpPale], p: merge(geoBuy, { 'fill-opacity': split ? 0 : 0.18 }) },
      { n: [s.nbUpPale],  p: merge(geoNb,  { 'fill-opacity': split ? 0 : 0.18 }) },
      { n: [s.buyUpOr],   p: merge(geoBuy, { 'fill-opacity': split ? 0.30 : 0,
                                             'stroke-opacity': split ? 0.9 : 0 }) },
      { n: [s.nbUpOr],    p: merge(geoNb,  { 'fill-opacity': split ? 0.30 : 0,
                                             'stroke-opacity': split ? 0.9 : 0 }) },

      // Dividers draw in at state 1 and vanish at state 3, where the upgrade
      // regions have swallowed the rows they used to separate.
      { n: [s.divBuy], p: { 'stroke-dashoffset': split ? 0 : BUY_W,
                            opacity: grown ? 0 : 1 } },
      { n: [s.divNb],  p: { 'stroke-dashoffset': split ? 0 : NB_W,
                            opacity: grown ? 0 : 1 } },

      { n: [s.buyLab.t, s.nbLab.t], p: { y: headY ? 46 : 198 }, stagger: 60 },
      // 68, not 64: at 64 the percentage's ascender box runs into the
      // descender box of the title above it. No ink overlaps, but the pair
      // reads cramped as a header.
      { n: [s.buyLab.p, s.nbLab.p], p: { y: headY ? 68 : 224 }, stagger: 60 },

      // Row labels: the two no-upgrade shares only exist while state === 1.
      { n: [s.lBuyNo, s.lNbNo], p: { opacity: st === 1 ? 1 : 0 }, stagger: 70 },
      { n: [s.lBuyUp], p: { opacity: rowOp, y: grown ? 210 : 129 } },
      { n: [s.lNbUp],  p: { opacity: rowOp, x: grown ? NB_X + NB_W / 2 : 788,
                            y: grown ? 210 : 88 } },
      { n: [s.leader], p: { opacity: (st >= 1 && st <= 2) ? 1 : 0 } },

      { n: [s.result], p: { opacity: grown ? 1 : 0 } }
    ];
  }

  function render(s, st, instant) {
    s.cap.textContent = CAPTIONS[st];

    // 32 -> 94 and 2 -> 6 are the same counts against a smaller denominator,
    // so the labels count rather than cut, in step with the regions growing.
    var toBuy = st >= 3 ? 94 : 32, toNb = st >= 3 ? 6 : 2;
    var groups = plan(s, st);

    // The re-normalisation is the point of the slide, so it gets a longer,
    // slower beat than the ordinary state changes (in or out of it).
    var dur = (st === 3 || s.state === 3) ? 700 : 460;
    s.state = st;

    if (instant || REDUCE ||
        typeof window.anime === 'undefined' || !window.anime.animate) {
      groups.forEach(function (g) {
        g.n.forEach(function (n) { setAttrs(n, g.p); });
      });
      s.cBuy.v = toBuy; s.cNb.v = toNb;
      s.lBuyUp.textContent = toBuy + '%';
      s.lNbUp.textContent = toNb + '%';
      return;
    }

    var A = window.anime;
    groups.forEach(function (g) {
      var p = merge(g.p, { duration: dur, ease: 'outCubic' });
      if (g.stagger) p.delay = A.stagger(g.stagger);
      A.animate(g.n, p);
    });

    if (s.cBuy.v !== toBuy) {
      A.animate(s.cBuy, {
        v: toBuy, duration: dur, ease: 'outCubic',
        onUpdate: function () { s.lBuyUp.textContent = Math.round(s.cBuy.v) + '%'; }
      });
      A.animate(s.cNb, {
        v: toNb, duration: dur, ease: 'outCubic',
        onUpdate: function () { s.lNbUp.textContent = Math.round(s.cNb.v) + '%'; }
      });
    }
  }

  var ORDER = ['cond-frag-1', 'cond-frag-2', 'cond-frag-3'];
  var STATES = { 'cond-frag-1': 1, 'cond-frag-2': 2, 'cond-frag-3': 3 };

  // How many gating fragments Reveal currently has shown. Landing on this
  // slide via a #hash or by stepping backwards from a later slide leaves
  // fragments already marked .visible; without this the freshly built stage
  // would show the un-split square while Reveal believes it is done, and the
  // next arrow press would leave the slide with the animation never run.
  function fragState(slide) {
    var n = 0;
    ORDER.forEach(function (id) {
      var f = slide.querySelector('#' + id);
      if (f && f.classList.contains('visible')) n++;
    });
    return n;
  }

  function init() {
    if (typeof Reveal === 'undefined') { setTimeout(init, 30); return; }
    var current = null;

    function mount(slide) {
      if (!slide) return;
      var stage = slide.querySelector('#cond-stage');
      if (!stage) { current = null; return; }
      current = build(stage);
      var s = fragState(slide);
      if (s) render(current, s, true);   // snap, don't animate, on entry
    }
    Reveal.on('slidechanged', function (e) { mount(e.currentSlide); });
    Reveal.on('ready', function () { mount(Reveal.getCurrentSlide()); });

    Reveal.on('fragmentshown', function (e) {
      var st = STATES[e.fragment.id];
      if (current && st !== undefined) render(current, st);
    });
    Reveal.on('fragmenthidden', function (e) {
      var st = STATES[e.fragment.id];
      if (current && st !== undefined) render(current, st - 1);
    });
  }
  init();
})();
</script>
