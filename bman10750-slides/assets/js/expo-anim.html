<script>
/*
  Poisson ↔ exponential animation — slide #expo-intuition.

  Teaching point: there is only ONE process here. A single stream of events
  arriving at a constant average rate answers two different questions, and
  the two answers are the two distributions:
    0. the stream itself — 39 events on a 40-unit timeline
    1. "how many land in one unit of time?"   → counts   → Poisson(1)
    2. "how long until the next one?"          → gaps     → exponential(1)
    3. conditioning on having already waited 1.0 — the surviving gaps slide
       left by 1.0 and re-normalise, and they land back on the SAME curve.

  State 3 is the reason this file exists. Memorylessness is usually asserted
  ("the exponential forgets"); here the bars are made to demonstrate it. The
  brick curve is drawn once at state 2 and never moves again, so the only
  thing that changes is the histogram — and it comes back to the same place.

  Built on StageKit (assets/js/stage-kit.html): palette, type roles and the
  Reveal fragment wiring live there. Canvas 1000x445, shown at scale(1.05).
*/
(function () {
  var K = window.StageKit;

  // Stage geometry — 1000x445 canvas, shown at scale(1.05).
  var W = 1000, H = 445;
  var TX0 = 60, TX1 = 940, TMAX = 40, AXIS_Y = 122;   // the timeline
  var TICK_H = 24, BRACK_Y = 169;
  var PX0 = 300, PX1 = 800, BASE = 378, HMAX = 189;   // the histogram panel
  var TITLE_Y = 207;

  var RATE = 1;

  // Opacity is driven through style throughout, never through the attribute:
  // anime resolves `opacity` as a CSS property, so a tweened inline style
  // would silently outrank any attribute we set on the instant path.
  function op(e, v) { e.style.opacity = v; }
  function tx(t) { return TX0 + t * ((TX1 - TX0) / TMAX); }

  /* ---------------------------------------------------------------- data --
     No Math.random anywhere. A plain LCG feeds inverse-CDF sampling —
     gap = -log(1-u)/rate — and the gaps are accumulated into arrival times.
     Generated once, at load, and reused by every state. The seed is fixed
     because a lecture slide has to show the same picture every time it runs;
     this particular draw is a clean one (39 events, no gap past 4.5, and a
     conditional histogram that still reads as a decaying exponential once
     only 13 gaps survive the conditioning).
  */
  var SEED = 124581 >>> 0;
  function rnd() {
    SEED = (Math.imul(1664525, SEED) + 1013904223) >>> 0;
    return (SEED + 0.5) / 4294967296;          // never exactly 0 or 1
  }

  var EVENTS = (function () {
    var t = 0, out = [];
    for (var i = 0; i < 400; i++) {
      t += -Math.log(1 - rnd()) / RATE;
      if (t > TMAX) break;
      out.push(t);
    }
    return out;
  }());

  // --- question 1: how many events land in each unit-wide window? ---
  var KMAX = 5, NK = KMAX + 1;
  var CPROP = (function () {
    var win = [], i;
    for (i = 0; i < TMAX; i++) win.push(0);
    EVENTS.forEach(function (t) { win[Math.min(TMAX - 1, Math.floor(t))]++; });
    var c = [];
    for (i = 0; i < NK; i++) c.push(0);
    win.forEach(function (n) { c[Math.min(KMAX, n)]++; });
    return c.map(function (n) { return n / TMAX; });
  }());

  // Poisson pmf by recurrence: P(0) = exp(-lambda), P(k) = P(k-1) * lambda/k.
  var POIS = (function () {
    var out = [], v = Math.exp(-RATE);
    out.push(v);
    for (var k = 1; k < NK; k++) { v = v * RATE / k; out.push(v); }
    return out;
  }());

  // --- question 2: how long between consecutive events? ---
  var GAPS = (function () {
    var out = [];
    for (var i = 1; i < EVENTS.length; i++) out.push(EVENTS[i] - EVENTS[i - 1]);
    return out;
  }());

  var BINW = 0.5, NBIN = 10, SHIFT = 1.0, SBIN = SHIFT / BINW;   // 2 bins
  var GCOUNT = (function () {
    var c = [], i;
    for (i = 0; i < NBIN; i++) c.push(0);
    GAPS.forEach(function (g) {
      var b = Math.floor(g / BINW);
      if (b >= 0 && b < NBIN) c[b]++;
    });
    return c;
  }());

  // Bars are drawn on a DENSITY scale — count / (n * binwidth) — so the
  // theoretical pdf can be laid straight over them with no area fudging.
  var NSURV = GCOUNT.slice(SBIN).reduce(function (a, b) { return a + b; }, 0);
  var GDENS = GCOUNT.map(function (c) { return c / (GAPS.length * BINW); });
  // Conditional on X >= 1: only the survivors are left, so they divide by
  // their own total. That is the 1/P(X > 1) rescaling, done empirically.
  var GCOND = GCOUNT.slice(SBIN).map(function (c) { return c / (NSURV * BINW); });

  /* ------------------------------------------------------------- scaling -- */
  var PMAX = 0.55, CFAC = HMAX / PMAX;          // proportion → px, count panel
  var DMAX = 1.05, DFAC = HMAX / DMAX;          // density    → px, gap panel

  var CSLOT = (PX1 - PX0) / NK, CBW = 58;       // ~83.3 per slot, 58 inked
  function cx(k) { return PX0 + k * CSLOT + (CSLOT - CBW) / 2; }
  var GSLOT = (PX1 - PX0) / NBIN, GBW = GSLOT - 6;   // 50 per bin, 44 inked
  function gx(i) { return PX0 + i * GSLOT + 3; }
  var GSHIFT = SBIN * GSLOT;                    // 1.0 unit of gap = 100px

  /* -------------------------------------------------------------- frames --
     Every state is precomputed as a full set of target attributes, so the
     animated path and the instant path read from exactly the same numbers.
  */
  function frame(state) {
    var f = {
      seps:   state === 1 ? 1 : 0,
      brack:  state >= 2 ? 1 : 0,
      pois:   state === 1 ? 0.85 : 0,
      expo:   state >= 2 ? 0.85 : 0,
      clab:   state === 1 ? 1 : 0,
      glab:   state >= 2 ? 1 : 0,
      mark:   state === 3 ? 1 : 0,
      ident:  state === 3 ? 1 : 0,
      title:  state >= 1 ? 1 : 0,
      legend: state >= 1 ? 1 : 0,
      cbars: [], gbars: []
    };
    for (var k = 0; k < NK; k++) {
      var ch = state === 1 ? CPROP[k] * CFAC : 0;
      f.cbars.push({ y: BASE - ch, h: ch, o: state === 1 ? 0.6 : 0 });
    }
    for (var i = 0; i < NBIN; i++) {
      var gh = 0, gxx = gx(i), go = 0;
      if (state === 2) {
        gh = GDENS[i] * DFAC; go = 0.6;
      } else if (state === 3) {
        if (i < SBIN) {
          // Waits shorter than 1.0 are already over — the conditioning
          // throws them away, so they are left where they are and dimmed.
          gh = GDENS[i] * DFAC; go = 0.10;
        } else {
          // Survivors: slide left by exactly 1.0 on the x-scale (a gap of
          // 1.5 becomes a remaining wait of 0.5) and re-normalise upward.
          gh = GCOND[i - SBIN] * DFAC; gxx = gx(i) - GSHIFT; go = 0.6;
        }
      }
      f.gbars.push({ x: gxx, y: BASE - gh, h: gh, o: go });
    }
    return f;
  }
  var FRAMES = [frame(0), frame(1), frame(2), frame(3)];

  var CAPTIONS = [
    'events at a constant average rate',
    'how many per interval → Poisson',
    'how long until the next → exponential',
    'waiting does not make it due'
  ];
  var TITLES = [
    '',
    'events per unit of time',
    'waiting time until the next one',
    'remaining wait, given you already waited 1.0'
  ];
  var LEGENDS = ['', 'Poisson(1)', 'exponential(1)', 'exponential(1)'];

  /* --------------------------------------------------------------- build -- */

  // Stepped outline over the same slots the count bars occupy: up the left
  // edge of bar 0, across each top, down the right edge of bar KMAX.
  function stepPoints(pmf) {
    var pts = [cx(0) + ',' + BASE];
    for (var k = 0; k < NK; k++) {
      var y = BASE - pmf[k] * CFAC;
      pts.push(cx(k) + ',' + y);
      pts.push((cx(k) + CBW) + ',' + y);
      if (k < KMAX) pts.push(cx(k + 1) + ',' + BASE, cx(k + 1) + ',' + BASE);
    }
    pts.push((cx(KMAX) + CBW) + ',' + BASE);
    return pts.join(' ');
  }

  // Smooth exp(-x) over the gap axis, on the same density scale as the bars.
  function pdfPoints() {
    var pts = [];
    for (var x = 0; x <= NBIN * BINW + 1e-9; x += 0.04) {
      pts.push((PX0 + x * (GSLOT / BINW)) + ',' + (BASE - Math.exp(-RATE * x) * DFAC));
    }
    return pts.join(' ');
  }

  function label(x, y, s, size, fill, family, anchor) {
    var t = K.el('text', {
      x: x, y: y, fill: fill, 'font-size': size,
      'font-family': family, 'text-anchor': anchor || 'middle'
    });
    t.textContent = s;
    return t;
  }

  function build(stage) {
    var svg = K.canvas(stage, W, H);
    var i, k;

    /* ---- the timeline: one stream of events, always on screen ---- */

    // Unit-window separators, drawn first so the event marks sit on top.
    var seps = [];
    for (i = 0; i <= TMAX; i++) {
      seps.push(svg.appendChild(K.el('line', {
        x1: tx(i), y1: AXIS_Y - TICK_H - 7, x2: tx(i), y2: AXIS_Y + 11,
        stroke: K.PAL.rule, 'stroke-width': 1, class: 'expo-sep'
      })));
    }
    seps.forEach(function (s) { op(s, 0); });

    svg.appendChild(K.el('line', {
      x1: TX0, y1: AXIS_Y, x2: TX1, y2: AXIS_Y,
      stroke: K.PAL.rule, 'stroke-width': 1
    }));
    for (i = 0; i <= TMAX; i += 10) {
      svg.appendChild(K.el('line', {
        x1: tx(i), y1: AXIS_Y, x2: tx(i), y2: AXIS_Y + 7,
        stroke: K.PAL.dim, 'stroke-width': 1
      }));
      svg.appendChild(label(tx(i), AXIS_Y + 27, i, K.TYPE.tick, K.PAL.inkSoft, K.FONT.mono));
    }

    EVENTS.forEach(function (t) {
      svg.appendChild(K.el('line', {
        x1: tx(t), y1: AXIS_Y - TICK_H, x2: tx(t), y2: AXIS_Y,
        stroke: K.PAL.brick, 'stroke-width': 2, class: 'expo-event'
      }));
    });

    // The gaps, as little end-capped brackets slung under the axis. One per
    // consecutive pair, so short waits genuinely look crowded.
    var brack = K.el('g', { class: 'expo-brackets' });
    for (i = 1; i < EVENTS.length; i++) {
      var a = tx(EVENTS[i - 1]), b = tx(EVENTS[i]);
      brack.appendChild(K.el('line', {
        x1: a, y1: BRACK_Y, x2: b, y2: BRACK_Y,
        stroke: K.PAL.olive, 'stroke-width': 1.5
      }));
      brack.appendChild(K.el('line', {
        x1: a, y1: BRACK_Y - 4, x2: a, y2: BRACK_Y + 4,
        stroke: K.PAL.olive, 'stroke-width': 1.5
      }));
      brack.appendChild(K.el('line', {
        x1: b, y1: BRACK_Y - 4, x2: b, y2: BRACK_Y + 4,
        stroke: K.PAL.olive, 'stroke-width': 1.5
      }));
    }
    op(brack, 0);
    svg.appendChild(brack);

    /* ---- the panel: one plot area, two meanings ---- */

    var cbars = [], gbars = [];
    for (k = 0; k < NK; k++) {
      cbars.push(svg.appendChild(K.el('rect', {
        x: cx(k), y: BASE, width: CBW, height: 0,
        fill: K.PAL.navy, class: 'expo-cbar'
      })));
    }
    for (i = 0; i < NBIN; i++) {
      gbars.push(svg.appendChild(K.el('rect', {
        x: gx(i), y: BASE, width: GBW, height: 0,
        fill: K.PAL.olive, class: 'expo-gbar'
      })));
    }
    cbars.concat(gbars).forEach(function (b) { op(b, 0); });

    var pois = svg.appendChild(K.el('polyline', {
      points: stepPoints(POIS), fill: 'none', stroke: K.PAL.brick,
      'stroke-width': 2, 'stroke-linejoin': 'round', class: 'expo-pois'
    }));
    var expo = svg.appendChild(K.el('polyline', {
      points: pdfPoints(), fill: 'none', stroke: K.PAL.brick,
      'stroke-width': 2, 'stroke-linejoin': 'round', class: 'expo-pdf'
    }));
    op(pois, 0); op(expo, 0);

    svg.appendChild(K.el('line', {
      x1: PX0, y1: BASE, x2: PX1, y2: BASE, stroke: K.PAL.rule, 'stroke-width': 1
    }));

    // Two sets of x labels — k = 0,1,2,… for counts, 0…5 for gap lengths —
    // swapped by opacity, because the axis means something different in each.
    var clab = K.el('g', {});
    for (k = 0; k < NK; k++) clab.appendChild(label(cx(k) + CBW / 2, BASE + 27, k, K.TYPE.tick, K.PAL.inkSoft, K.FONT.mono));
    var glab = K.el('g', {});
    for (i = 0; i <= NBIN * BINW; i++) glab.appendChild(label(PX0 + i * (GSLOT / BINW), BASE + 27, i, K.TYPE.tick, K.PAL.inkSoft, K.FONT.mono));
    op(clab, 0); op(glab, 0);
    svg.appendChild(clab); svg.appendChild(glab);

    // Conditioning marker: everything left of it is a wait that already ended.
    var mark = K.el('g', {});
    mark.appendChild(K.el('line', {
      x1: PX0 + GSHIFT, y1: BASE, x2: PX0 + GSHIFT, y2: 278,
      stroke: K.PAL.orange, 'stroke-width': 1.5, 'stroke-dasharray': '4 4'
    }));
    mark.appendChild(label(PX0 + GSHIFT + 8, 271, 'already waited 1.0', K.TYPE.label, K.PAL.orange, K.FONT.sans, 'start'));
    op(mark, 0);
    svg.appendChild(mark);

    var ident = svg.appendChild(
      label((PX0 + PX1) / 2, 436, 'P(X > 1+t | X > 1) = P(X > t)', K.TYPE.label, K.PAL.ink, K.FONT.mono));
    op(ident, 0);

    var title = svg.appendChild(label(PX1, TITLE_Y, '', K.TYPE.label, K.PAL.inkSoft, K.FONT.sans, 'end'));
    op(title, 0);

    var cap = svg.appendChild(label(40, 28, CAPTIONS[0], K.TYPE.caption, K.PAL.inkSoft, K.FONT.sans, 'start'));

    // Legend for the brick theory line — it names what the bars are chasing.
    var legend = K.el('g', {});
    legend.appendChild(K.el('line', {
      x1: 782, y1: 65, x2: 818, y2: 65, stroke: K.PAL.brick, 'stroke-width': 2
    }));
    var legText = label(826, 70, '', K.TYPE.label, K.PAL.inkSoft, K.FONT.sans, 'start');
    legend.appendChild(legText);
    op(legend, 0);
    svg.appendChild(legend);

    return {
      seps: seps, brack: brack, cbars: cbars, gbars: gbars, pois: pois,
      expo: expo, clab: clab, glab: glab, mark: mark, ident: ident,
      title: title, cap: cap, legend: legend, legText: legText
    };
  }

  /* --------------------------------------------------------------- place -- */

  function place(s, state, instant) {
    var f = FRAMES[state];
    s.cap.textContent = CAPTIONS[state];
    s.title.textContent = TITLES[state];
    s.legText.textContent = LEGENDS[state];

    // Everything that is just a fade, in one indexed list.
    var fades = [s.brack, s.pois, s.expo, s.clab, s.glab,
                 s.mark, s.ident, s.title, s.legend];
    var fadeTo = [f.brack, f.pois, f.expo, f.clab, f.glab,
                  f.mark, f.ident, f.title, f.legend];

    if (instant || K.REDUCE || !K.animeReady()) {
      s.seps.forEach(function (e) { op(e, f.seps); });
      fades.forEach(function (e, i) { op(e, fadeTo[i]); });
      s.cbars.forEach(function (b, k) {
        b.setAttribute('y', f.cbars[k].y);
        b.setAttribute('height', f.cbars[k].h);
        op(b, f.cbars[k].o);
      });
      s.gbars.forEach(function (b, i) {
        b.setAttribute('x', f.gbars[i].x);
        b.setAttribute('y', f.gbars[i].y);
        b.setAttribute('height', f.gbars[i].h);
        op(b, f.gbars[i].o);
      });
      return;
    }

    var A = window.anime;
    A.animate(s.seps, {
      opacity: f.seps, duration: 420, delay: A.stagger(6), ease: 'outCubic'
    });
    A.animate(fades, {
      opacity: function (el, i) { return fadeTo[i]; },
      duration: 420, ease: 'outCubic'
    });
    // Rects grow downward from y, so y and height have to move together or
    // the bars would slide off the baseline mid-flight.
    A.animate(s.cbars, {
      y: function (el, k) { return f.cbars[k].y; },
      height: function (el, k) { return f.cbars[k].h; },
      opacity: function (el, k) { return f.cbars[k].o; },
      duration: 600, delay: A.stagger(24), ease: 'outCubic'
    });
    // The state 2 → 3 move: x carries the "slide left by 1.0", height carries
    // the re-normalisation. Both on the same 800ms outCubic so the bars read
    // as one gesture landing back on the curve, which never moved.
    A.animate(s.gbars, {
      x: function (el, i) { return f.gbars[i].x; },
      y: function (el, i) { return f.gbars[i].y; },
      height: function (el, i) { return f.gbars[i].h; },
      opacity: function (el, i) { return f.gbars[i].o; },
      duration: 800, delay: A.stagger(24), ease: 'outCubic'
    });
  }

  K.register({
    stage: 'expo-stage',
    frags: ['expo-frag-1', 'expo-frag-2', 'expo-frag-3'],
    build: build,
    place: place
  });
})();
</script>
