<script>
/*
  Mean-vs-median animation — slide #mm-intuition (Seminar 2).

  Teaching point: the mean is a balance point, so it is dragged towards
  whatever is furthest away; the median only counts positions, so it does
  not care how far the tail runs. The presenter advances fragments and:
    0. eleven roughly symmetric values — the two markers sit on top of
       each other, which is why the distinction looks pointless at first
    1. the largest value walks out to 96 — the mean walks with it
    2. a second value walks out to 92 — the mean moves again, the median
       has still not moved a pixel

  Built on StageKit (assets/js/stage-kit.html): palette, type roles and the
  Reveal fragment wiring live there. Canvas 1000x445, shown at scale(1.05).
*/
(function () {
  var K = window.StageKit;

  var BASE = [38, 42, 45, 47, 49, 50, 52, 54, 56, 59, 62];

  // Each state is the full value array, not a delta, so mean/median are
  // always recomputed from what is actually on screen.
  var VALUES = [
    BASE,
    BASE.map(function (v, i) { return i === 10 ? 96 : v; }),
    BASE.map(function (v, i) { return i === 10 ? 96 : (i === 9 ? 92 : v); })
  ];

  var CAPTIONS = [
    'symmetric data — mean and median agree',
    'one outlier — the mean follows it',
    'two outliers — the median has still not moved'
  ];

  // Stage geometry — 1000x445 canvas, shown at scale(1.05).
  var W = 1000, H = 445, X0 = 60, X1 = 940, VMIN = 0, VMAX = 100;
  var AXIS_Y = 351, ROW_Y = 246, DOT_R = 10;
  // The two markers are stacked, never side by side: in state 0 they land
  // on almost the same value, and horizontal labels would collide there.
  var MEAN_TOP = 358, MEDIAN_TOP = 398, TRI_H = 14, TRI_W = 8, LAB_DROP = 32;

  function px(v) { return X0 + (v - VMIN) * (X1 - X0) / (VMAX - VMIN); }

  function mean(vals) {
    var s = 0;
    vals.forEach(function (v) { s += v; });
    return s / vals.length;
  }
  function median(vals) {
    var a = vals.slice().sort(function (x, y) { return x - y; });
    var m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  // A marker is built at x = 0 and moved with a translate, so one tween of
  // a single number drives the triangle, the label and the readout at once
  // — they cannot drift apart.
  function marker(svg, name, colour, top) {
    var g = K.el('g', { transform: 'translate(0,0)' });
    g.appendChild(K.el('polygon', {
      points: '0,' + top + ' ' + (-TRI_W) + ',' + (top + TRI_H) +
              ' ' + TRI_W + ',' + (top + TRI_H),
      fill: K.PAL[colour]
    }));
    var lab = K.txt(-5, top + LAB_DROP, name,
      { size: 'label', face: 'sans', fill: colour, anchor: 'end' });
    g.appendChild(lab);
    var num = K.txt(5, top + LAB_DROP, '',
      { size: 'readout', face: 'mono', fill: colour, weight: 700, anchor: 'start' });
    g.appendChild(num);
    svg.appendChild(g);

    return {
      set: function (v) {
        g.setAttribute('transform', 'translate(' + px(v) + ',0)');
        num.textContent = v.toFixed(1);
      }
    };
  }

  function build(stage) {
    var svg = K.canvas(stage, W, H);

    // --- axis ---
    svg.appendChild(K.el('line', {
      x1: X0, y1: AXIS_Y, x2: X1, y2: AXIS_Y, stroke: K.PAL.rule, 'stroke-width': 1
    }));
    [0, 20, 40, 60, 80, 100].forEach(function (v) {
      svg.appendChild(K.el('line', {
        x1: px(v), y1: AXIS_Y, x2: px(v), y2: AXIS_Y + 7,
        stroke: K.PAL.dim, 'stroke-width': 1
      }));
      svg.appendChild(K.txt(px(v), AXIS_Y - 14, v,
        { size: 'tick', face: 'mono', anchor: 'middle' }));
    });

    var cap = K.txt(X0, 28, CAPTIONS[0], { size: 'caption', cls: 'mm-caption' });
    svg.appendChild(cap);

    // --- the sample ---
    var dots = BASE.map(function (v) {
      return svg.appendChild(K.el('circle', {
        cx: px(v), cy: ROW_Y, r: DOT_R,
        fill: K.PAL.navy, opacity: 0.5, class: 'mm-dot'
      }));
    });

    var mMean = marker(svg, 'mean', 'brick', MEAN_TOP);
    var mMed = marker(svg, 'median', 'olive', MEDIAN_TOP);

    return { dots: dots, cap: cap, mean: mMean, median: mMed, at: 0 };
  }

  function snap(s, state) {
    var vals = VALUES[state];
    s.cap.textContent = CAPTIONS[state];
    s.dots.forEach(function (d, i) { d.setAttribute('cx', px(vals[i])); });
    s.mean.set(mean(vals));
    s.median.set(median(vals));
    s.at = state;
  }

  function place(s, state, instant) {
    var vals = VALUES[state];
    var from = VALUES[s.at];
    s.cap.textContent = CAPTIONS[state];
    s.at = state;

    if (instant || K.REDUCE || !K.animeReady()) {
      snap(s, state);
      return;
    }

    var A = window.anime;
    A.animate(s.dots, {
      cx: function (el, i) { return px(vals[i]); },
      duration: 700,
      ease: 'outCubic'
    });

    // The mean is tweened rather than jumped so the marker and its readout
    // move together with the dot that is dragging them. The median gets the
    // same treatment for symmetry of code — its start and end are equal, so
    // on screen it simply refuses to budge, which is the whole point.
    [[s.mean, mean(from), mean(vals)],
     [s.median, median(from), median(vals)]].forEach(function (job) {
      var mk = job[0], p = { v: job[1] }, end = job[2];
      A.animate(p, {
        v: end,
        duration: 700,
        ease: 'outCubic',
        onUpdate: function () { mk.set(p.v); }
      });
    });
  }

  K.register({
    stage: 'mm-stage',
    frags: ['mm-frag-1', 'mm-frag-2'],
    build: build,
    place: place
  });
})();
</script>
