<script>
/*
  Three-sellers animation — slide #seller-intuition (Seminar 4).

  Teaching point: this is #binom-intuition READ BACKWARDS. There the success
  rate was fixed at p = 0.3 and the count k varied, and the answer was a
  distribution over counts. Here the count is the thing you already saw — it
  is data, it is finished — and the unknown is the rate s. Same expression,
  s^k * (1-s)^(n-k), scanned along the other axis. Nothing new is being
  taught; the formula is being turned round.

  Three online sellers, all excellent on the face of it:
    A:  10 of 10   (100%)
    B:  48 of 50   (96%)
    C: 186 of 200  (93%)
  The picture answers "which would you actually buy from?" and the answer is
  B, which no single percentage on that list would have told you.

  Advancing the fragments adds one seller at a time:
    0. an empty plot over s — the axis of the question
    1. A: a broad slab. Ten reviews barely narrow anything; s could be 0.80.
    2. B: visibly tighter, and still sitting high.
    3. C: a spike. Two hundred reviews pin s down precisely — precisely at a
       mediocre value. Narrow is not the same as good, and that contrast
       between A's slab and C's needle is the whole slide.

  Every number is computed here, not typed: the curves, the plausible ranges
  and the three tail probabilities all come out of the same likelihood. Two
  things make that survivable in floating point:
    - the likelihood is formed in LOGS and shifted by its own maximum before
      exponentiating. 0.93^186 is about 1e-6 and the far tail is far worse;
      exponentiating first would hand back a flat zero and the curve would
      simply not be there.
    - each curve is normalised to ITS OWN peak, which is the only way three
      sellers with wildly different amounts of evidence can share one frame.
      That makes the heights meaningless across sellers and the shapes the
      entire message, so the y-axis label says so out loud.

  Built on StageKit (assets/js/stage-kit.html): palette, type roles and the
  Reveal fragment wiring live there. Canvas 1000x445, shown at scale(1.05).
*/
(function () {
  var K = window.StageKit;

  // --- the three sellers ---------------------------------------------------
  var SELLERS = [
    { id: 'A', k: 10,  n: 10,  colour: K.PAL.navy },
    { id: 'B', k: 48,  n: 50,  colour: K.PAL.olive },
    { id: 'C', k: 186, n: 200, colour: K.PAL.brick }
  ];

  var THRESH = 0.10;      // "plausible" = relative likelihood at least this
  var GOOD = 0.95;        // the bar a seller has to clear to be worth it
  var NGRID = 20001;      // integration/scan grid on [0,1]; 0.95 lands on it

  // log of s^k * (1-s)^(n-k). The guards are not paranoia: seller A has
  // n - k = 0, so the second term is 0 * log(0) = NaN at s = 1 — exactly the
  // point where A's curve peaks — unless a zero exponent short-circuits to 0.
  function logLik(k, n, s) {
    var a = k > 0 ? k * Math.log(s) : 0;
    var b = (n - k) > 0 ? (n - k) * Math.log(1 - s) : 0;
    return a + b;
  }

  // Everything the slide prints about one seller, derived once at load.
  // rel(s) is the likelihood divided by its own maximum, so rel(peak) = 1 by
  // construction and no exponential ever leaves the range [0, 1].
  function analyse(sl) {
    var k = sl.k, n = sl.n;
    var peak = k / n;                       // the MLE, and the shift constant
    var top = logLik(k, n, peak);

    function rel(s) {
      var v = Math.exp(logLik(k, n, s) - top);
      return isFinite(v) ? v : 0;
    }

    // One pass over the grid does both jobs: the ends of the plausible range
    // and the trapezoid integral, with the tail above 0.95 accumulated from
    // the same segments so the two can never disagree.
    var lo = 1, hi = 0, tot = 0, tail = 0, prevR = null, prevS = 0, i, s, r, w;
    for (i = 0; i < NGRID; i++) {
      s = i / (NGRID - 1);
      r = rel(s);
      if (r >= THRESH) { if (s < lo) lo = s; if (s > hi) hi = s; }
      if (prevR !== null) {
        w = (s - prevS) * (r + prevR) / 2;
        tot += w;
        if (prevS >= GOOD) tail += w;
      }
      prevR = r; prevS = s;
    }

    return {
      id: sl.id, k: k, n: n, colour: sl.colour, rel: rel,
      peak: peak, lo: lo, hi: hi, ptail: tail / tot
    };
  }
  var S = SELLERS.map(analyse);

  // --- stage geometry — fixed 1000x445 space, scaled to the slide via CSS ---
  var W = 1000, H = 445;
  var X0 = 90, X1 = 700, SMIN = 0.5, SMAX = 1.0;
  var BASE = 312, PEAK_Y = 89;             // baseline, and where rel = 1 lands
  var NPT = 320;                           // samples along each curve
  var TICK = 7;                            // bracket end-tick length

  var SOFT = K.PAL.inkSoft, RULE = K.PAL.rule, GREY = K.PAL.dim;
  var MONO = K.FONT.mono, SANS = K.FONT.sans;
  var NB = ' ';    // SVG <text> eats runs of ordinary spaces; this one survives

  // The brackets stack under the axis, one lane per seller, in reveal order.
  var LANE_Y = [358, 385, 412];

  // The readout on the right. Two lines per seller, 26px apart (label role,
  // 20px) with a 44px gap after the second line so each record reads as its
  // own group; RD_BLOCK is RD_LINE plus that 44px gap.
  var RD_X = 740, RD_Y = 122, RD_LINE = 26, RD_BLOCK = 70;

  function px(s) { return X0 + (s - SMIN) * (X1 - X0) / (SMAX - SMIN); }
  function py(r) { return BASE - r * (BASE - PEAK_Y); }

  // Left-pad with non-breaking spaces so the three records line up on their
  // slashes: "10 / 10" and "186 / 200" are different widths otherwise.
  function pad(v, w) {
    var s = String(v);
    while (s.length < w) s = NB + s;
    return s;
  }

  // The visible half of the curve. s below 0.5 is dead space for all three
  // sellers — nobody with 93% of two hundred reviews is a coin flip — so the
  // plot is truncated there and the axis label admits it.
  function curvePath(a) {
    var d = '', i, s;
    for (i = 0; i <= NPT; i++) {
      s = SMIN + (SMAX - SMIN) * i / NPT;
      d += (i ? 'L' : 'M') + px(s).toFixed(2) + ' ' + py(a.rel(s)).toFixed(2);
    }
    return d;
  }

  // A bracket in s-space with end ticks pointing down, same shape as the
  // confidence-interval lanes on #ciflip-intuition so the two slides read as
  // the same gesture: "this is the range the data will tolerate".
  function bracket(a, y) {
    var x0 = px(a.lo), x1 = px(a.hi);
    return 'M' + x0.toFixed(2) + ' ' + y + 'V' + (y + TICK) +
           'H' + x1.toFixed(2) + 'V' + y;
  }

  function build(stage) {
    var svg = K.canvas(stage, W, H);
    var i;

    var cap = svg.appendChild(K.txt(40, 28, CAPTIONS[0],
      { size: 'caption', cls: 'seller-caption' }));

    // --- what the vertical axis is, and the caveat that comes with it ---
    svg.appendChild(K.txt(X0, 71,
      'relative likelihood (each curve scaled to its own peak)',
      { size: 'label', fill: SOFT }));

    // --- the s axis ---
    svg.appendChild(K.el('line', {
      x1: X0, y1: BASE, x2: X1, y2: BASE, stroke: RULE, 'stroke-width': 1
    }));
    for (i = 0; i <= 5; i++) {
      var v = 0.5 + i * 0.1;
      svg.appendChild(K.el('line', {
        x1: px(v), y1: BASE, x2: px(v), y2: BASE + 6,
        stroke: GREY, 'stroke-width': 1
      }));
      svg.appendChild(K.txt(px(v), 336, v.toFixed(1),
        { size: 'tick', face: 'mono', anchor: 'middle' }));
    }
    // Left-anchored, and broken over two short lines rather than set on one
    // long one. Every bracket sits on the right half of the axis, so the
    // strip from x = 90 to about x = 310 is the only clear space under it,
    // and a centred — or single 40-character — title runs straight through
    // seller A's range label, which is right-anchored at x = 439. The
    // truncation has to be admitted somewhere, so it gets the second line.
    svg.appendChild(K.txt(X0, 370, 'true success rate s',
      { size: 'label', fill: SOFT }));
    svg.appendChild(K.txt(X0, 393, '(axis truncated below 0.5)',
      { size: 'label', fill: SOFT }));

    // --- one curve, one bracket lane and one readout block per seller ---
    var lanes = S.map(function (a, idx) {
      var path = svg.appendChild(K.el('path', {
        d: curvePath(a), fill: 'none', stroke: a.colour, 'stroke-width': 2.5,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round',
        opacity: 0, class: 'seller-curve'
      }));

      // Bracket, its numeric range, and the readout share one group so a
      // seller arrives (and leaves) as a single object.
      var side = svg.appendChild(K.el('g', {
        opacity: 0, class: 'seller-side'
      }));
      side.appendChild(K.el('path', {
        d: bracket(a, LANE_Y[idx]), fill: 'none', stroke: a.colour,
        'stroke-width': 2
      }));
      // The range sits to the LEFT of its bracket: to the right is the
      // readout column, and seller A's bracket already reaches x = 700.
      side.appendChild(K.txt(px(a.lo) - 10, LANE_Y[idx] + 5,
        a.id + NB + '[' + a.lo.toFixed(3) + ', ' + a.hi.toFixed(3) + ']',
        { size: 'label', face: 'mono', anchor: 'end', fill: a.colour }));

      var y = RD_Y + idx * RD_BLOCK;
      side.appendChild(K.txt(RD_X, y,
        a.id + NB + NB + pad(a.k, 3) + ' / ' + pad(a.n, 3),
        { size: 'label', face: 'mono', fill: a.colour }));
      side.appendChild(K.txt(RD_X, y + RD_LINE,
        'P(s > ' + GOOD.toFixed(2) + ') = ' + a.ptail.toFixed(2),
        { size: 'label', fill: SOFT }));

      return { path: path, side: side, len: 0, on: false };
    });

    // Path lengths are only measurable once the svg is in the document
    // (K.canvas already appended it), so the dash setup happens here.
    lanes.forEach(function (ln) {
      var len = 0;
      try { len = ln.path.getTotalLength(); } catch (e) { len = 0; }
      ln.len = len;
      ln.path.setAttribute('stroke-dasharray', len);
      ln.path.setAttribute('stroke-dashoffset', len);
    });

    return { state: 0, cap: cap, lanes: lanes, anims: [] };
  }

  // Keep these SHORT. The caption is left-anchored at x=40, y=28; at 24px
  // Roboto (~12px per character) anything much past ~40 characters runs
  // under the right-hand furniture.
  var CAPTIONS = [
    'same formula, now s varies not k',
    '10 of 10 — but only ten',
    '48 of 50 — narrower already',
    '186 of 200 — narrowest, and lowest'
  ];

  // Cancel everything still in flight before the next beat. A curve draw runs
  // for the best part of a second; a presenter arrowing back during it would
  // otherwise have the old tween keep writing its own dashoffset over a state
  // that no longer contains that seller.
  function stop(s) {
    s.anims.forEach(function (a) { if (a && a.pause) a.pause(); });
    s.anims = [];
  }

  function render(s, st, instant) {
    stop(s);
    s.state = st;
    s.cap.textContent = CAPTIONS[st];
    var fast = instant || K.REDUCE || !K.animeReady();
    var A = window.anime;

    s.lanes.forEach(function (ln, idx) {
      var on = st >= idx + 1;

      if (fast) {
        ln.path.setAttribute('opacity', on ? 1 : 0);
        ln.path.setAttribute('stroke-dashoffset', on ? 0 : ln.len);
        ln.side.setAttribute('opacity', on ? 1 : 0);
        ln.on = on;
        return;
      }
      if (on === ln.on) return;             // already where it should be

      if (on) {
        // The curve is drawn left to right, so the eye follows the rise and
        // arrives at the peak; the bracket and the readout land just after,
        // once there is a shape for them to describe.
        ln.path.setAttribute('opacity', 1);
        ln.path.setAttribute('stroke-dashoffset', ln.len);
        var p = { u: 0 };
        s.anims.push(A.animate(p, {
          u: 1, duration: 900, ease: 'outCubic',
          onUpdate: function () {
            ln.path.setAttribute('stroke-dashoffset', (1 - p.u) * ln.len);
          }
        }));
        s.anims.push(A.animate(ln.side, {
          opacity: 1, duration: 380, delay: 560, ease: 'outQuad'
        }));
      } else {
        // Rewind the dash on the way out, so stepping back and forward draws
        // the curve again instead of blinking a finished one into place.
        s.anims.push(A.animate(ln.path, {
          opacity: 0, duration: 260, ease: 'outQuad',
          onComplete: function () {
            ln.path.setAttribute('stroke-dashoffset', ln.len);
          }
        }));
        s.anims.push(A.animate(ln.side, {
          opacity: 0, duration: 260, ease: 'outQuad'
        }));
      }
      ln.on = on;
    });
  }

  K.register({
    stage: 'seller-stage',
    frags: ['seller-frag-1', 'seller-frag-2', 'seller-frag-3'],
    build: build,
    place: render,
    stop: stop
  });
})();
</script>
