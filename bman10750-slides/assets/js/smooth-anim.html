<script>
/*
  Exponential smoothing animation — slide #smooth-intuition.

  Teaching point: alpha is not a knob you tune in the dark, it is a statement
  about how much you trust the LAST observation. Expanding the recursion

      F(t+1) = alpha * x(t) + (1 - alpha) * F(t)

  turns the forecast into a weighted average of every past observation with
  geometrically decaying weights alpha * (1 - alpha)^k. So the deck shows the
  weight profile and the forecast it produces side by side, and the presenter
  raises alpha through fragments:
    0. alpha = 0.2  long memory, sluggish line, weights decay slowly
    1. alpha = 0.5  half the weight on the very last point
    2. alpha = 0.8  almost no memory, the line just chases the data

  The payoff is that the weight bars collapse onto the first bar at exactly
  the moment the forecast line snaps onto the series.

  Fragment gating follows the deck convention: invisible .fi-frag spans on
  the slide, listened to via Reveal's fragmentshown/fragmenthidden.
*/
(function () {
  var REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // A noisy, trendless series — hardcoded so the lecture picture never moves.
  var DATA = [23, 39, 36, 26, 36, 12, 26, 30, 42, 35, 36, 28];
  var SEED = 40;                                  // F(2), the usual naive start

  // Stage geometry — fixed 1000x400 space, scaled to the slide via CSS.
  var W = 1000, H = 400;
  var LX0 = 80, LX1 = 600;                        // left panel: series + forecast
  var RX0 = 690, RX1 = 950;                       // right panel: weight profile
  var BASE_Y = 320, TOP_V = 50, AXIS_Y = 336;     // value 0 sits on BASE_Y
  var NKEEP = 8, BAR_MAX = 210, W_FULL = 0.85;    // weight 0.85 fills a bar
  var NS = 'http://www.w3.org/2000/svg';

  var ALPHAS = [0.2, 0.5, 0.8];
  var CAPTIONS = [
    // Keep these SHORT, and do NOT repeat the alpha value: the big orange
    // readout is right-anchored at x=600, y=38, so a caption past roughly
    // 46 characters (17px Roboto, ~8.4px each) collides with it.
    'a long memory — smooth, sluggish forecast',
    'half the weight on the last observation',
    'almost no memory; it chases the last point'
  ];

  function ox(i) { return LX0 + i * (LX1 - LX0) / (DATA.length - 1); }
  function oy(v) { return BASE_Y - v * (BASE_Y - 70) / TOP_V; }
  function bx(k) { return RX0 + (k + 0.5) * (RX1 - RX0) / NKEEP; }
  function el(name, attrs) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // The recursion itself. F(0) has no forecast; F(1) is seeded; everything
  // after that is the one-step-ahead forecast the students will draw by hand.
  function forecast(alpha) {
    var f = [SEED], i;
    for (i = 1; i < DATA.length - 1; i++) {
      f.push(alpha * DATA[i] + (1 - alpha) * f[i - 1]);
    }
    return f.map(function (v) { return oy(v); });   // y for points 1 .. n-1
  }

  // The same alpha seen from the other side: what the recursion is implicitly
  // paying each past observation.
  function weights(alpha) {
    var w = [], k;
    for (k = 0; k < NKEEP; k++) w.push(alpha * Math.pow(1 - alpha, k));
    return w;
  }

  function poly(ys, x0) {
    return ys.map(function (y, i) { return ox(i + x0) + ',' + y; }).join(' ');
  }

  function build(stage) {
    stage.innerHTML = '';
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H });

    // --- caption ---
    var cap = el('text', {
      x: 40, y: 34, fill: '#6E7681', 'font-size': 17,
      'font-family': 'Roboto, sans-serif', class: 'smooth-caption'
    });
    cap.textContent = CAPTIONS[0];
    svg.appendChild(cap);

    // --- left panel: time axis ---
    svg.appendChild(el('line', {
      x1: LX0, y1: AXIS_Y, x2: LX1, y2: AXIS_Y,
      stroke: '#E5E7EB', 'stroke-width': 1
    }));
    [0, 3, 6, 9, 11].forEach(function (i) {
      svg.appendChild(el('line', {
        x1: ox(i), y1: AXIS_Y, x2: ox(i), y2: AXIS_Y + 6,
        stroke: '#B0B7C0', 'stroke-width': 1
      }));
      var t = el('text', {
        x: ox(i), y: AXIS_Y + 22, 'text-anchor': 'middle', fill: '#6E7681',
        'font-size': 13, 'font-family': 'JetBrains Mono, monospace'
      });
      t.textContent = i + 1;
      svg.appendChild(t);
    });

    // --- left panel: the data, drawn once and never touched again ---
    svg.appendChild(el('polyline', {
      points: DATA.map(function (v, i) { return ox(i) + ',' + oy(v); }).join(' '),
      fill: 'none', stroke: '#B0B7C0', 'stroke-width': 1
    }));

    // --- left panel: the forecast, redrawn on every alpha ---
    var fy = forecast(ALPHAS[0]);
    var line = el('polyline', {
      points: poly(fy, 1), fill: 'none', stroke: '#F47C3C',
      'stroke-width': 2.5, 'stroke-linejoin': 'round', class: 'smooth-line'
    });
    svg.appendChild(line);

    DATA.forEach(function (v, i) {
      svg.appendChild(el('circle', {
        cx: ox(i), cy: oy(v), r: 5, fill: '#325D88', opacity: 0.55
      }));
    });

    var ltitle = el('text', {
      x: LX0, y: 380, fill: '#6E7681', 'font-size': 15,
      'font-family': 'Roboto, sans-serif'
    });
    ltitle.textContent = 'the series and its forecast';
    svg.appendChild(ltitle);

    // --- the alpha readout, the one number the whole slide is about ---
    var read = el('text', {
      x: LX1, y: 38, 'text-anchor': 'end', fill: '#F47C3C',
      'font-size': 22, 'font-weight': 700,
      'font-family': 'JetBrains Mono, monospace', class: 'smooth-alpha'
    });
    read.textContent = 'alpha = ' + ALPHAS[0].toFixed(1);
    svg.appendChild(read);

    // --- right panel: weight profile, k = 0 (most recent) on the left ---
    svg.appendChild(el('line', {
      x1: RX0, y1: BASE_Y, x2: RX1, y2: BASE_Y,
      stroke: '#E5E7EB', 'stroke-width': 1
    }));

    var w0 = weights(ALPHAS[0]);
    var bw = 0.62 * (RX1 - RX0) / NKEEP;
    var bars = w0.map(function (w, k) {
      var h = w / W_FULL * BAR_MAX;
      var r = el('rect', {
        x: bx(k) - bw / 2, y: BASE_Y - h, width: bw, height: h,
        fill: '#325D88', opacity: 0.6, class: 'smooth-bar'
      });
      svg.appendChild(r);
      var t = el('text', {
        x: bx(k), y: BASE_Y + 20, 'text-anchor': 'middle', fill: '#6E7681',
        'font-size': 12, 'font-family': 'JetBrains Mono, monospace'
      });
      t.textContent = 't-' + k;
      svg.appendChild(t);
      return r;
    });

    var rtitle = el('text', {
      x: RX0, y: 380, fill: '#6E7681', 'font-size': 15,
      'font-family': 'Roboto, sans-serif'
    });
    rtitle.textContent = 'how much each past observation counts';
    svg.appendChild(rtitle);

    stage.appendChild(svg);
    return { cap: cap, read: read, line: line, bars: bars, fy: fy };
  }

  function place(s, i, instant) {
    var alpha = ALPHAS[i];
    var fy = forecast(alpha);
    var ws = weights(alpha);
    var from = s.fy;

    s.cap.textContent = CAPTIONS[i];
    s.read.textContent = 'alpha = ' + alpha.toFixed(1);

    if (instant || REDUCE ||
        typeof window.anime === 'undefined' || !window.anime.animate) {
      s.line.setAttribute('points', poly(fy, 1));
      s.bars.forEach(function (r, k) {
        var h = ws[k] / W_FULL * BAR_MAX;
        r.setAttribute('y', BASE_Y - h);
        r.setAttribute('height', h);
      });
      s.fy = fy;
      return;
    }

    var A = window.anime;

    // The polyline has no tweenable attribute, so drive a scalar and rebuild
    // the points string from it — same easing, same clock as the bars.
    var p = { t: 0 };
    A.animate(p, {
      t: 1,
      duration: 700,
      ease: 'outCubic',
      onUpdate: function () {
        s.line.setAttribute('points', poly(fy.map(function (y, j) {
          return from[j] + (y - from[j]) * p.t;
        }), 1));
      }
    });

    A.animate(s.bars, {
      y: function (el, k) { return BASE_Y - ws[k] / W_FULL * BAR_MAX; },
      height: function (el, k) { return ws[k] / W_FULL * BAR_MAX; },
      duration: 700,
      delay: A.stagger(40),
      ease: 'outCubic'
    });

    s.fy = fy;
  }

  var ORDER = ['smooth-frag-1', 'smooth-frag-2'];
  var STATES = { 'smooth-frag-1': 1, 'smooth-frag-2': 2 };

  // How many gating fragments Reveal currently has shown. Landing on this
  // slide via a #hash or by stepping backwards from a later slide leaves
  // fragments already marked .visible; without this the freshly built stage
  // would sit at alpha = 0.2 while Reveal believes it is done, and the next
  // arrow press would leave the slide with the animation never having run.
  function fragState(slide) {
    var n = 0;
    ORDER.forEach(function (id) {
      var f = slide.querySelector('#' + id);
      if (f && f.classList.contains('visible')) n++;
    });
    return n;
  }

  function init() {
    if (typeof Reveal === 'undefined') { setTimeout(init, 30); return; }
    var current = null;

    function mount(slide) {
      if (!slide) return;
      var stage = slide.querySelector('#smooth-stage');
      if (!stage) { current = null; return; }
      current = build(stage);
      var s = fragState(slide);
      if (s) place(current, s, true);   // snap, don't animate, on entry
    }
    Reveal.on('slidechanged', function (e) { mount(e.currentSlide); });
    Reveal.on('ready', function () { mount(Reveal.getCurrentSlide()); });

    Reveal.on('fragmentshown', function (e) {
      var i = STATES[e.fragment.id];
      if (current && i !== undefined) place(current, i);
    });
    Reveal.on('fragmenthidden', function (e) {
      var i = STATES[e.fragment.id];
      if (current && i !== undefined) place(current, i - 1);
    });
  }
  init();
})();
</script>
