<script>
/*
  Module 2 "layer-by-layer" ggplot animations — tidyquant-style charts.

  Four slides share this engine:
    .fp1-slide → AAPL candlestick + SMA(6) overlay
    .fp2-slide → AAPL OHLC bars + SMA(12) overlay
    .fp3-slide → SPY line + Bollinger bands (12-mo, ±2σ)
    .fp4-slide → 2×2 facet of AAPL / MSFT / SPY / TLT candlesticks

  Config schema (each demo qmd sets window.FPn_CONFIG):
    stageId, markerClass, fragmentIds, xDomain, yDomain, xBreaks, yBreaks,
    xMinor, yMinor, labs {title,x,y,color}, colors, codeHtml,
    geom:    'line' | 'candlestick' | 'ohlc'
    overlay: { type: 'ma',     window: 6, color: '#F47C3C' } |
             { type: 'bbands', window: 12, mult: 2, color: '#325D88' } | null
    ticker:  'AAPL'  (single-panel; data pulled from window.OHLC_DATA)
    facet:   { tickers: ['AAPL','MSFT','SPY','TLT'], rows: 2, cols: 2 } | null
    layers:  ordered list of reveal stages, e.g. ['geom','overlay','labs','theme']

  window.OHLC_DATA is baked in via assets/js/ohlc-data.html:
    { AAPL: [[monthIdx, open, high, low, close], ...], MSFT: [...], ... }
*/
(function () {
  window.TM = window.TM || {};
  TM.onReveal = TM.onReveal || function (cb) {
    (function go() {
      if (typeof Reveal === 'undefined' || !Reveal.on) { setTimeout(go, 50); return; }
      cb();
    })();
  };
  TM.gate = TM.gate || function (opts) {
    function visibleStage() {
      var n = 0;
      for (var i = 0; i < opts.fragmentIds.length; i++) {
        var f = document.getElementById(opts.fragmentIds[i]);
        if (f && f.classList.contains('visible')) n++;
        else break;
      }
      return n;
    }
    function onThisSlide(slide) {
      return slide && (slide.classList.contains(opts.markerClass) ||
                       slide.querySelector('.' + opts.markerClass));
    }
    TM.onReveal(function () {
      Reveal.on('fragmentshown',  function () { if (onThisSlide(Reveal.getCurrentSlide())) opts.render(visibleStage()); });
      Reveal.on('fragmenthidden', function () { if (onThisSlide(Reveal.getCurrentSlide())) opts.render(visibleStage()); });
      Reveal.on('slidechanged',   function (e) { if (onThisSlide(e.currentSlide)) opts.render(visibleStage()); });
      (function boot() {
        var cur = Reveal.getCurrentSlide && Reveal.getCurrentSlide();
        if (!cur) { setTimeout(boot, 60); return; }
        if (onThisSlide(cur)) opts.render(visibleStage());
      })();
    });
  };

  var SVGNS = 'http://www.w3.org/2000/svg';
  function el(name, attrs, parent) {
    var e = document.createElementNS(SVGNS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(svg, x, y, s, attrs) {
    var t = el('text', Object.assign({ x: x, y: y, 'font-family': 'sans-serif' }, attrs), svg);
    t.textContent = s;
    return t;
  }
  function expand(dom) { var e = (dom[1] - dom[0]) * 0.03; return [dom[0] - e, dom[1] + e]; }

  // Round a domain into ~n "nice" tick values (1, 2, 5, 10 × 10^k).
  function niceTicks(lo, hi, n) {
    var span = hi - lo;
    var raw  = span / Math.max(1, n);
    var mag  = Math.pow(10, Math.floor(Math.log10(raw)));
    var norm = raw / mag;
    var step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    var major = [], minor = [];
    var start = Math.ceil(lo / step) * step;
    for (var v = start; v <= hi + 1e-9; v += step) major.push(+v.toFixed(6));
    for (var v = start - step / 2; v <= hi; v += step) {
      if (v >= lo) minor.push(+v.toFixed(6));
    }
    return { major: major, minor: minor };
  }

  // ---- indicator math ----
  function closes(rows) { return rows.map(function (r) { return r[4]; }); }
  function sma(rows, w) {
    var c = closes(rows), out = [];
    for (var i = 0; i < rows.length; i++) {
      if (i < w - 1) continue;
      var s = 0;
      for (var j = 0; j < w; j++) s += c[i - j];
      out.push([rows[i][0], s / w]);
    }
    return out;
  }
  function bbands(rows, w, mult) {
    var c = closes(rows), out = [];
    for (var i = 0; i < rows.length; i++) {
      if (i < w - 1) continue;
      var s = 0;
      for (var j = 0; j < w; j++) s += c[i - j];
      var mean = s / w, vs = 0;
      for (var j = 0; j < w; j++) { var d = c[i - j] - mean; vs += d * d; }
      var std = Math.sqrt(vs / w);
      out.push({ x: rows[i][0], mid: mean, upper: mean + mult * std, lower: mean - mult * std });
    }
    return out;
  }

  // ---- panel builders ----
  // A "panel" is a self-contained plotting box with its own scales.
  // Single-chart slides use one panel; facet slides use N.
  function makePanel(cfg, box) {
    // box: { x, y, w, h } in stage pixel coords.
    // Top margin reserves room for the plot title to sit ABOVE the coord canvas
    // (moved out of the plot interior per user request). Facet panels use less
    // headroom because the per-panel ticker title is smaller.
    // Bottom margin defaults to 52 (Emil-style landscape aspect); slides can
    // override via cfg.marginB.
    var M = {
      l: 58,
      r: cfg.legend ? 130 : 22,
      t: cfg.title ? 26 : 46,
      b: cfg.marginB != null ? cfg.marginB : 52
    };
    var PX0 = box.x + M.l, PX1 = box.x + box.w - M.r;
    var PY0 = box.y + M.t, PY1 = box.y + box.h - M.b;
    var xd = expand(cfg.xDomain), yd = expand(cfg.yDomain);
    function sx(v) { return PX0 + (v - xd[0]) / (xd[1] - xd[0]) * (PX1 - PX0); }
    function sy(v) { return PY1 - (v - yd[0]) / (yd[1] - yd[0]) * (PY1 - PY0); }
    return { PX0: PX0, PX1: PX1, PY0: PY0, PY1: PY1, sx: sx, sy: sy, box: box, title: cfg.title };
  }

  function drawCoord(svg, p, cfg) {
    // Grey ggplot canvas
    el('rect', {
      x: p.PX0, y: p.PY0, width: p.PX1 - p.PX0, height: p.PY1 - p.PY0,
      fill: '#EBEBEB', class: 'fp-bg'
    }, svg);
    function grid(vs, isX, w, cls) {
      vs.forEach(function (v) {
        var attrs = isX
          ? { x1: p.sx(v), x2: p.sx(v), y1: p.PY0, y2: p.PY1 }
          : { x1: p.PX0, x2: p.PX1, y1: p.sy(v), y2: p.sy(v) };
        attrs.stroke = '#fff';
        attrs['stroke-width'] = w;
        attrs['class'] = cls;
        el('line', attrs, svg);
      });
    }
    grid(cfg.xMinor,  true,  1, 'fp-grid-minor');
    grid(cfg.yMinor,  false, 1, 'fp-grid-minor');
    grid(cfg.xBreaks, true,  1.4, 'fp-grid-major');
    grid(cfg.yBreaks, false, 1.4, 'fp-grid-major');

    cfg.xBreaks.forEach(function (v) {
      txt(svg, p.sx(v), p.PY1 + 15, v, { 'text-anchor': 'middle', 'font-size': 10, fill: '#4d4d4d' });
    });
    cfg.yBreaks.forEach(function (v) {
      txt(svg, p.PX0 - 6, p.sy(v) + 3, v, { 'text-anchor': 'end', 'font-size': 10, fill: '#4d4d4d' });
    });
    if (p.title) {
      txt(svg, (p.PX0 + p.PX1) / 2, p.box.y + 16, p.title,
          { 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: '#1d2433' });
    }
  }

  function drawLine(svg, p, rows, color) {
    var d = '';
    rows.forEach(function (r, i) {
      d += (i ? 'L' : 'M') + p.sx(r[0]) + ',' + p.sy(r[4]) + ' ';
    });
    el('path', {
      d: d, fill: 'none', stroke: color || '#325D88',
      'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
    }, svg);
  }

  function drawCandles(svg, p, rows, upColor, downColor) {
    // Body width chosen from x-spacing, minus a small gap
    var xs = rows.map(function (r) { return p.sx(r[0]); });
    var span = rows.length > 1 ? Math.abs(xs[1] - xs[0]) : 6;
    var bw = Math.max(1.8, span * 0.7);
    rows.forEach(function (r) {
      var x = p.sx(r[0]);
      var yo = p.sy(r[1]), yh = p.sy(r[2]), yl = p.sy(r[3]), yc = p.sy(r[4]);
      var up = r[4] >= r[1];
      var color = up ? upColor : downColor;
      // Wick: high -> low
      el('line', {
        x1: x, x2: x, y1: yh, y2: yl,
        stroke: color, 'stroke-width': 1
      }, svg);
      // Body: open -> close
      var yTop = Math.min(yo, yc), yBot = Math.max(yo, yc);
      var h = Math.max(1, yBot - yTop);
      el('rect', {
        x: x - bw / 2, y: yTop, width: bw, height: h,
        fill: up ? color : color,
        stroke: color, 'stroke-width': 0.8,
        'fill-opacity': up ? 0.15 : 0.9  // hollow up, filled down (tidyquant default)
      }, svg);
    });
  }

  function drawOHLCBars(svg, p, rows, upColor, downColor) {
    var xs = rows.map(function (r) { return p.sx(r[0]); });
    var span = rows.length > 1 ? Math.abs(xs[1] - xs[0]) : 6;
    var tick = Math.max(1.5, span * 0.35);
    rows.forEach(function (r) {
      var x = p.sx(r[0]);
      var yo = p.sy(r[1]), yh = p.sy(r[2]), yl = p.sy(r[3]), yc = p.sy(r[4]);
      var color = r[4] >= r[1] ? upColor : downColor;
      el('line', { x1: x, x2: x, y1: yh, y2: yl, stroke: color, 'stroke-width': 1.2 }, svg);
      el('line', { x1: x - tick, x2: x, y1: yo, y2: yo, stroke: color, 'stroke-width': 1.2 }, svg);
      el('line', { x1: x, x2: x + tick, y1: yc, y2: yc, stroke: color, 'stroke-width': 1.2 }, svg);
    });
  }

  function drawMA(svg, p, rows, w, color) {
    var pts = sma(rows, w);
    var d = '';
    pts.forEach(function (q, i) { d += (i ? 'L' : 'M') + p.sx(q[0]) + ',' + p.sy(q[1]) + ' '; });
    el('path', {
      d: d, fill: 'none', stroke: color, 'stroke-width': 1.8,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      'stroke-dasharray': '4,3'
    }, svg);
  }

  function drawBBands(svg, p, rows, w, mult, color) {
    var pts = bbands(rows, w, mult);
    if (!pts.length) return;
    // Ribbon between upper and lower
    var upperD = '', lowerD = '';
    pts.forEach(function (q, i) {
      upperD += (i ? 'L' : 'M') + p.sx(q.x) + ',' + p.sy(q.upper) + ' ';
      lowerD += (i ? 'L' : 'M') + p.sx(q.x) + ',' + p.sy(q.lower) + ' ';
    });
    // Fill polygon: upper forward, lower backward
    var fillD = 'M';
    pts.forEach(function (q, i) { fillD += (i ? 'L' : '') + p.sx(q.x) + ',' + p.sy(q.upper) + ' '; });
    for (var i = pts.length - 1; i >= 0; i--) fillD += 'L' + p.sx(pts[i].x) + ',' + p.sy(pts[i].lower) + ' ';
    fillD += 'Z';
    el('path', { d: fillD, fill: color, 'fill-opacity': 0.12, stroke: 'none' }, svg);
    el('path', { d: upperD, fill: 'none', stroke: color, 'stroke-width': 1, 'stroke-opacity': 0.6 }, svg);
    el('path', { d: lowerD, fill: 'none', stroke: color, 'stroke-width': 1, 'stroke-opacity': 0.6 }, svg);
    // Mid (SMA of same window)
    var midD = '';
    pts.forEach(function (q, i) { midD += (i ? 'L' : 'M') + p.sx(q.x) + ',' + p.sy(q.mid) + ' '; });
    el('path', {
      d: midD, fill: 'none', stroke: color, 'stroke-width': 1.5,
      'stroke-dasharray': '4,3'
    }, svg);
  }

  function drawLabs(svg, p, cfg) {
    if (cfg.labs.title) {
      // Title sits centered ABOVE the coord canvas (in the reserved top band).
      var cx = (p.PX0 + p.PX1) / 2;
      txt(svg, cx, p.box.y + 30, cfg.labs.title,
          { 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, fill: '#1d2433' });
    }
    if (cfg.labs.x) {
      txt(svg, (p.PX0 + p.PX1) / 2, p.box.y + p.box.h - 10, cfg.labs.x,
          { 'text-anchor': 'middle', 'font-size': 13, fill: '#1d2433' });
    }
    if (cfg.labs.y) {
      var cy = (p.PY0 + p.PY1) / 2;
      var yt = txt(svg, p.box.x + 14, cy, cfg.labs.y,
          { 'text-anchor': 'middle', 'font-size': 13, fill: '#1d2433' });
      yt.setAttribute('transform', 'rotate(-90 ' + (p.box.x + 14) + ' ' + cy + ')');
    }
  }

  // ---- animation orchestration ----
  function makeAnim(cfg) {
    var W = 640, H = 460;   // matches .fp-plot geometry (Emil-style landscape, enlarged)
    var built = false;
    var planeCoord, planeGeom, planeOverlay, planeLabs;
    var codeBlocks = [];

    function mkPlane() {
      var d = document.createElement('div');
      d.className = 'fp-plane';
      d.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity 0.55s ease;';
      var s = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H });
      s.style.cssText = 'position:absolute;left:0;top:0;';
      d.appendChild(s);
      return { div: d, svg: s };
    }

    function build() {
      var stage = document.getElementById(cfg.stageId);
      if (!stage || built) return !!stage;
      built = true;

      var code = document.createElement('pre');
      code.className = 'gg-code fp-code';
      code.innerHTML = cfg.codeHtml;
      stage.appendChild(code);
      codeBlocks = Array.prototype.slice.call(code.querySelectorAll('[data-blk]'));

      var plot = document.createElement('div');
      plot.className = 'fp-plot';
      plot.id = cfg.stageId + '-plot';

      planeCoord   = mkPlane();
      planeGeom    = mkPlane();
      planeOverlay = mkPlane();
      planeLabs    = mkPlane();

      // Single or facet layout
      if (cfg.facet) {
        var rows = cfg.facet.rows, cols = cfg.facet.cols;
        // Reserve a top band for the facet suptitle so panels don't crowd it.
        var topBand = cfg.labs.title ? 54 : 0;
        var availH  = H - topBand;
        var cellW   = W / cols, cellH = availH / rows;
        cfg.facet.tickers.forEach(function (tk, i) {
          var box = {
            x: (i % cols) * cellW,
            y: topBand + Math.floor(i / cols) * cellH,
            w: cellW,
            h: cellH
          };
          // free_y: each panel scales to its own OHLC range
          var tRows = (window.OHLC_DATA && window.OHLC_DATA[tk]) || [];
          var lows = tRows.map(function (r) { return r[3]; });
          var highs = tRows.map(function (r) { return r[2]; });
          var lo = Math.min.apply(null, lows), hi = Math.max.apply(null, highs);
          var pad = (hi - lo) * 0.06;
          var yD = [Math.max(0, lo - pad), hi + pad];
          var yTicks = niceTicks(yD[0], yD[1], 4);
          var panelCfg = Object.assign({}, cfg, {
            title: tk,
            yDomain: yD,
            yBreaks: yTicks.major,
            yMinor: yTicks.minor
          });
          var p = makePanel(panelCfg, box);
          drawCoord(planeCoord.svg, p, panelCfg);
          drawGeomFor(planeGeom.svg, p, cfg, tk);
          if (cfg.overlay) drawOverlayFor(planeOverlay.svg, p, cfg, tk);
        });
        // Facet-level suptitle: rendered in the coord plane so it stays visible
        // from stage 0 (title sits ABOVE the panels in the reserved top band).
        if (cfg.labs.title) {
          txt(planeCoord.svg, W / 2, 30, cfg.labs.title,
              { 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, fill: '#1d2433' });
        }
      } else {
        var p = makePanel(cfg, { x: 0, y: 0, w: W, h: H });
        drawCoord(planeCoord.svg, p, cfg);
        drawGeomFor(planeGeom.svg, p, cfg, cfg.ticker);
        if (cfg.overlay) drawOverlayFor(planeOverlay.svg, p, cfg, cfg.ticker);
        drawLabs(planeLabs.svg, p, cfg);
        drawLegend(planeLabs.svg, p, cfg);
      }

      plot.appendChild(planeCoord.div);
      plot.appendChild(planeGeom.div);
      plot.appendChild(planeOverlay.div);
      plot.appendChild(planeLabs.div);
      stage.appendChild(plot);
      return true;
    }

    function drawGeomFor(svg, p, cfg, tk) {
      var rows = (window.OHLC_DATA && window.OHLC_DATA[tk]) || [];
      var up = cfg.colors && cfg.colors[0] || '#2A4E72';
      var dn = cfg.colors && cfg.colors[1] || '#B94A48';
      if (cfg.geom === 'candlestick') drawCandles(svg, p, rows, up, dn);
      else if (cfg.geom === 'ohlc')   drawOHLCBars(svg, p, rows, up, dn);
      else                             drawLine(svg, p, rows, up);
    }

    function drawOverlayFor(svg, p, cfg, tk) {
      var rows = (window.OHLC_DATA && window.OHLC_DATA[tk]) || [];
      var ov = cfg.overlay;
      if (ov.type === 'ma')     drawMA(svg, p, rows, ov.window, ov.color || '#F47C3C');
      else if (ov.type === 'bbands') drawBBands(svg, p, rows, ov.window, ov.mult || 2, ov.color || '#325D88');
    }

    function drawLegend(svg, p, cfg) {
      if (!cfg.legend) return;
      var LX = p.PX1 + 14, LY0 = p.PY0 + 24;
      txt(svg, LX, LY0 - 14, cfg.labs.color || '', { 'font-size': 12, 'font-weight': 700, fill: '#1d2433' });
      var entries = cfg.legendEntries || [];
      entries.forEach(function (e, i) {
        var y = LY0 + i * 22;
        el('rect', { x: LX, y: y - 10, width: 14, height: 14, rx: 2, fill: '#EBEBEB', class: 'fp-leg-swatch' }, svg);
        if (e.dashed) {
          el('line', { x1: LX + 1, x2: LX + 13, y1: y - 3, y2: y - 3,
                       stroke: e.color, 'stroke-width': 2, 'stroke-dasharray': '3,2' }, svg);
        } else {
          el('circle', { cx: LX + 7, cy: y - 3, r: 3.5, fill: e.color }, svg);
        }
        txt(svg, LX + 22, y, e.label, { 'font-size': 12, fill: '#1d2433' });
      });
    }

    function render(stageIdx) {
      if (!build()) return;
      planeCoord.div.style.opacity = 1;

      // Map stage index -> which layers should be visible
      // cfg.layers is an ordered reveal sequence, e.g. ['geom','overlay','labs','theme']
      var visible = {};
      var themeOn = false;
      for (var i = 0; i < cfg.layers.length; i++) {
        if (stageIdx > i) {
          if (cfg.layers[i] === 'theme') themeOn = true;
          else visible[cfg.layers[i]] = true;
        }
      }
      planeGeom.div.style.opacity    = visible.geom    ? 1 : 0;
      planeOverlay.div.style.opacity = visible.overlay ? 1 : 0;
      planeLabs.div.style.opacity    = visible.labs    ? 1 : 0;

      [planeCoord, planeGeom, planeOverlay, planeLabs].forEach(function (pl) {
        pl.div.classList.toggle('fp-theme-minimal', themeOn);
      });

      // Code highlighting: hot = current top layer's block
      var revealed = cfg.layers.slice(0, stageIdx);  // e.g. ['geom','overlay']
      var hot = revealed.length ? revealed[revealed.length - 1] : 'base';
      codeBlocks.forEach(function (b) {
        var blk = b.dataset.blk;
        var idx = cfg.layers.indexOf(blk);
        var pos = blk === 'base' ? -1 : idx;
        b.classList.toggle('fp-hot',    blk === hot);
        b.classList.toggle('fp-past',   pos !== -1 && pos < stageIdx - 1);
        b.classList.toggle('fp-future', pos !== -1 && pos >= stageIdx);
      });
    }

    TM.gate({
      markerClass: cfg.markerClass,
      fragmentIds: cfg.fragmentIds,
      render: render
    });
  }

  function boot() {
    ['FP1_CONFIG', 'FP2_CONFIG', 'FP3_CONFIG', 'FP4_CONFIG'].forEach(function (k) {
      if (window[k]) makeAnim(window[k]);
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
